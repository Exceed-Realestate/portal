<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registered Customers — Exceed Portal</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <!-- PWA: manifest, theme color, iOS install support. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a1f3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exceed">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script src="pwa-init.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="liquid.css">
  <style>
    :root {
      --navy-0: #15171c;
      --navy-1: #1c1f26;
      --navy-2: #262a33; --navy-3: #2f3340;
      --line: rgba(255,255,255,0.06);
      --line-strong: rgba(255,255,255,0.12);
      --text: #f5f7fa;
      --muted: #8a91a3;
      --gold: #ffd84d;
      --cream: #f5f7fa;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background:
        var(--navy-0);
      color: var(--text);
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(5,20,40,0.7);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 40px; height: 40px; border-radius: 8px; }
    .brand-name {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      letter-spacing: 2px;
      font-weight: 600;
    }
    .brand-name span { color: var(--gold); font-weight: 400; }
    .topbar-actions { display: flex; gap: 10px; }
    .btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
      transition: background .2s ease, border-color .2s ease;
    }
    .btn:hover { background: rgba(255,255,255,0.1); border-color: var(--line-strong); }
    .btn svg { width: 14px; height: 14px; }

    .container { max-width: 1280px; margin: 0 auto; padding: 40px 32px; }
    .page-head {
      display: flex; align-items: end; justify-content: space-between;
      margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
    }
    .page-head h1 {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      font-weight: 600;
      font-size: clamp(24px, 3vw, 32px);
      margin: 0;
    }
    .page-head .count {
      color: var(--muted); font-size: 13px; margin-top: 6px;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .page-head .count strong { color: var(--cream); font-weight: 600; }
    .search {
      background: rgba(5,20,40,0.7);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      width: 280px; max-width: 100%;
      outline: none;
      transition: border-color .2s ease;
    }
    .search:focus { border-color: var(--gold); }
    .search::placeholder { color: #5d6c87; }

    .table-wrap {
      background: linear-gradient(180deg, rgba(16,42,79,0.85), rgba(10,31,61,0.85));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    thead { background: rgba(5,20,40,0.5); }
    th {
      text-align: left;
      padding: 14px 18px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.025); }
    .name { font-weight: 600; color: var(--cream); }
    .reg-num {
      font-family: ui-monospace, 'SF Mono', monospace;
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 1.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .reg-num:hover { color: #fff; }
    .email, .phone { font-family: ui-monospace, 'SF Mono', monospace; font-size: 12px; color: var(--muted); }
    .empty, .loading {
      text-align: center; padding: 60px 24px; color: var(--muted); font-size: 14px;
    }
    .denied {
      max-width: 480px; margin: 100px auto;
      text-align: center; padding: 40px 32px;
      background: linear-gradient(180deg, rgba(16,42,79,0.85), rgba(10,31,61,0.85));
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .denied h2 { font-family: 'Inter', 'Noto Sans JP', sans-serif; margin: 0 0 12px; color: var(--cream); }
    .denied p { color: var(--muted); margin: 0 0 22px; font-size: 14px; }

    .toast {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: rgba(16,42,79,0.95);
      border: 1px solid rgba(212,184,122,0.4);
      color: var(--text);
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 14px;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      z-index: 999;
      backdrop-filter: blur(10px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 720px) {
      .container { padding: 24px 16px; }
      .page-head { gap: 12px; }
      .page-head h1 { font-size: 22px; }
      .search { width: 100%; }
      th, td { padding: 12px 12px; font-size: 13px; }
      .hide-sm { display: none; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 12px 14px; flex-wrap: wrap; gap: 10px; }
      .brand img { width: 32px; height: 32px; }
      .brand-name { font-size: 13px; letter-spacing: 1.5px; }
      .topbar-actions { flex-wrap: wrap; gap: 6px; }
      .btn { padding: 7px 10px; font-size: 11px; }
      .container { padding: 18px 12px; }
      th, td { padding: 10px 10px; font-size: 12px; }
      table { min-width: 560px; }
    }
    /* ============================================================
       v2 — Wise-style sidebar shell (matches agent.html)
       ============================================================ */
    .v2-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .v2-side {
      position: sticky; top: 0;
      height: 100vh; width: 240px;
      background: var(--navy-1);
      border-right: 1px solid var(--navy-3);
      display: flex; flex-direction: column;
      padding: 20px 14px 14px;
      z-index: 30;
    }
    .v2-brand {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; padding: 4px 6px 18px;
      border-bottom: 1px solid var(--navy-3);
    }
    .v2-brand-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--gold); color: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; letter-spacing: .5px;
      font-family: 'Inter', sans-serif;
    }
    .v2-brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .v2-brand-text strong { color: var(--cream); font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; }
    .v2-brand-text span { color: var(--muted); font-size: 10.5px; letter-spacing: .5px; }
    .v2-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; flex: 1; }
    .v2-nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 8px;
      color: var(--muted);
      font-size: 13.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      transition: background .15s, color .15s;
      position: relative;
    }
    .v2-nav-item:hover { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item svg { width: 18px; height: 18px; flex: none; }
    .v2-nav-item.active { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item.active::before {
      content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px;
      width: 3px; background: var(--gold); border-radius: 0 3px 3px 0;
    }
    .v2-foot { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--navy-3); }
    .v2-foot-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border-radius: 8px;
      background: transparent; border: 0;
      color: var(--muted); font-size: 12.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-align: left; cursor: pointer;
      transition: background .15s, color .15s;
      text-decoration: none;
    }
    .v2-foot-btn:hover { background: var(--navy-2); color: var(--cream); }
    .v2-foot-btn svg { width: 16px; height: 16px; flex: none; }
    .v2-main { display: flex; flex-direction: column; min-width: 0; padding: 0 0 40px; }
    .v2-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 18px 32px;
      border-bottom: 1px solid var(--navy-3);
      background: var(--navy-0);
    }
    .v2-top-user { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .v2-top-user strong { color: var(--cream); font-weight: 600; }
    .v2-top-actions { display: flex; align-items: center; gap: 10px; }
    .v2-main .page-head { padding-top: 32px; }
    .v2-main .page-head .eyebrow { color: var(--muted); letter-spacing: 1.8px; }
    @media (max-width: 1180px) {
      .v2-shell { grid-template-columns: 64px 1fr; }
      .v2-side { width: 64px; padding: 16px 8px; }
      .v2-brand-text, .v2-nav-item span, .v2-foot-btn span { display: none; }
      .v2-nav-item, .v2-foot-btn { justify-content: center; padding: 10px; }
      .v2-brand { justify-content: center; }
    }
    @media (max-width: 820px) {
      .v2-shell { grid-template-columns: 1fr; }
      .v2-side {
        position: relative; height: auto; width: 100%;
        flex-direction: row; align-items: center;
        padding: 12px 16px; border-right: 0;
        border-bottom: 1px solid var(--navy-3);
      }
      .v2-nav { flex-direction: row; margin-top: 0; gap: 4px; overflow-x: auto; }
      .v2-nav-item.active::before { display: none; }
      .v2-nav-item.active { box-shadow: inset 0 -2px 0 var(--gold); }
      .v2-foot { flex-direction: row; padding-top: 0; border-top: 0; }
      .v2-top { padding: 14px 18px; }
    }

  </style>
  <script src="theme-init.js"></script>
</head>
<body class="dashboard-bg">
  <div class="v2-shell">

    <!-- ===== Sidebar ===== -->
    <aside class="v2-side">
      <div class="v2-brand" onclick="window.location.href='agent.html'" title="Exceed Real Estate">
        <div class="v2-brand-mark">EX</div>
        <div class="v2-brand-text">
          <strong>Exceed</strong>
          <span>REAL ESTATE</span>
        </div>
      </div>
      <nav class="v2-nav">
        <a class="v2-nav-item" href="agent.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>ダッシュボード</span>
        </a>
        <a class="v2-nav-item" href="availability.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>カレンダー</span>
        </a>
        <a class="v2-nav-item" href="team.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>チーム</span>
        </a>
        <a class="v2-nav-item" href="travel.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
          <span>出張</span>
        </a>
        <a class="v2-nav-item" href="database.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          <span>データベース</span>
        </a>
      </nav>
      <div class="v2-foot">
        <a class="v2-foot-btn" href="agent.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span data-i18n="back">ダッシュボード</span>
        </a>
      </div>
    </aside>

    <!-- ===== Main pane ===== -->
    <div class="v2-main">

      <header class="v2-top">
        <div class="v2-top-user">
          <span data-i18n="hello">こんにちは、</span><strong id="userName">—</strong>
        </div>
        <div class="v2-top-actions">
          <div class="lang-toggle" id="langToggle">
            <span class="pill" id="langPill"></span>
            <button data-lang="ja" class="active">日本語</button>
            <button data-lang="en">EN</button>
          </div>
        </div>
      </header>
  <div class="bg-skyline"></div>
  <div class="bg-overlay"></div>

  <div id="content"></div>
  <div class="toast" id="toast"></div>
    </div><!-- /v2-main -->
  </div><!-- /v2-shell -->

  <script type="module">
    import { auth, db, isAdmin, can, loadCapabilityOverrides } from './firebase-init.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { collection, getDocs, query, orderBy, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const content = document.getElementById('content');
    let allCustomers = [];

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function fmtDate(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function renderDenied(reason) {
      content.innerHTML = `
        <div class="denied">
          <h2>アクセスが許可されていません</h2>
          <p>${reason || 'このページを表示する権限がありません。CEO・MD・役員クラス・システム管理者のみアクセス可能です。'}</p>
          <a class="btn" href="agent.html">ダッシュボードへ</a>
        </div>`;
    }

    function renderTable(filter = '') {
      const f = filter.trim().toLowerCase();
      const rows = allCustomers.filter(c =>
        !f || `${c.firstName} ${c.lastName} ${c.email} ${c.phone || ''} ${c.regNumber || ''} ${c.company || ''}`.toLowerCase().includes(f)
      );
      const tbody = rows.length ? rows.map(c => `
        <tr>
          <td><span class="reg-num" onclick="copyRegNum('${esc(c.regNumber)}')">${esc(c.regNumber)}</span></td>
          <td><div class="name">${esc(c.firstName)} ${esc(c.lastName)}</div></td>
          <td class="email">${esc(c.email)}</td>
          <td class="phone">${esc(c.phone || '—')}</td>
          <td>${esc(c.company || '—')}</td>
          <td>${fmtDate(c.createdAt)}</td>
          <td class="email">${esc(c.registeredByEmail || '—')}</td>
        </tr>`).join('')
        : `<tr><td colspan="7" class="empty">該当する顧客が見つかりません。</td></tr>`;
      document.getElementById('customerRows').innerHTML = tbody;
      document.getElementById('countShown').textContent = rows.length;
    }

    window.copyRegNum = async function(num) {
      try {
        await navigator.clipboard.writeText(num);
        showToast(num + ' をコピーしました');
      } catch {
        showToast('コピーに失敗しました');
      }
    };

    async function loadCustomers() {
      content.innerHTML = `
        <div class="container">
          <div class="page-head">
            <div>
              <h1>Registered Customers</h1>
              <div class="count"><strong id="countShown">0</strong> / <strong id="countTotal">0</strong> 顧客</div>
            </div>
            <input class="search" id="searchInput" placeholder="番号・名前・メール・会社で検索…" />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Reg. Number</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Company</th>
                  <th>Registered</th>
                  <th>By Agent</th>
                </tr>
              </thead>
              <tbody id="customerRows">
                <tr><td colspan="7" class="loading">読み込み中…</td></tr>
              </tbody>
            </table>
          </div>
        </div>`;
      try {
        const q = query(collection(db, 'customers'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        allCustomers = snap.docs.map(d => d.data());
        document.getElementById('countTotal').textContent = allCustomers.length;
        renderTable();
        document.getElementById('searchInput').addEventListener('input', e => renderTable(e.target.value));
      } catch (err) {
        document.getElementById('customerRows').innerHTML =
          `<tr><td colspan="7" class="empty">エラー: ${esc(err.message)}</td></tr>`;
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      await loadCapabilityOverrides(db);
      let role = null;
      try {
        const snap = await getDoc(doc(db, 'agents', user.uid));
        if (snap.exists()) role = snap.data().role || null;
      } catch (e) {}
      if (!can(role, 'viewAllCustomers', user.email)) {
        renderDenied();
        return;
      }
      content.innerHTML = `<div class="container"><div class="loading">読み込み中…</div></div>`;
      loadCustomers();
    });

    window.logout = async function() {
      try { await signOut(auth); } catch (e) {}
      window.location.href = 'index.html';
    };
  </script>
  <script src="glass-fx.js" defer></script>
</body>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registered Agents — Exceed Portal</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <!-- PWA: manifest, theme color, iOS install support. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a1f3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exceed">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script src="pwa-init.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="liquid.css">
  <style>
    :root {
      --navy-0: #15171c;
      --navy-1: #1c1f26;
      --navy-2: #262a33; --navy-3: #2f3340;
      --line: rgba(255,255,255,0.06);
      --line-strong: rgba(255,255,255,0.12);
      --text: #f5f7fa;
      --muted: #8a91a3;
      --gold: #ffd84d;
      --cream: #f5f7fa;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background:
        var(--navy-0);
      color: var(--text);
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--line);
      background: rgba(5,20,40,0.7);
      backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 40px; height: 40px; border-radius: 8px; }
    .brand-name {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      letter-spacing: 2px;
      font-weight: 600;
    }
    .brand-name span { color: var(--gold); font-weight: 400; }
    .topbar-actions { display: flex; gap: 10px; }
    .btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
      transition: background .2s ease, border-color .2s ease;
    }
    .btn:hover { background: rgba(255,255,255,0.1); border-color: var(--line-strong); }
    .btn svg { width: 14px; height: 14px; }

    .container { max-width: 1200px; margin: 0 auto; padding: 40px 32px; }
    .page-head {
      display: flex; align-items: end; justify-content: space-between;
      margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
    }
    .page-head h1 {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      font-weight: 600;
      font-size: clamp(24px, 3vw, 32px);
      margin: 0;
    }
    .page-head .count {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .page-head .count strong { color: var(--cream); font-weight: 600; }

    .search {
      background: rgba(5,20,40,0.7);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      width: 280px;
      max-width: 100%;
      outline: none;
      transition: border-color .2s ease;
    }
    .search:focus { border-color: var(--gold); }
    .search::placeholder { color: #5d6c87; }

    .table-wrap {
      background: linear-gradient(180deg, rgba(16,42,79,0.85), rgba(10,31,61,0.85));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table-wrap::-webkit-scrollbar { height: 6px; }
    .table-wrap::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    thead {
      background: rgba(5,20,40,0.5);
    }
    th {
      text-align: left;
      padding: 14px 18px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.025); }
    .name { font-weight: 600; color: var(--cream); }
    .email { font-family: ui-monospace, 'SF Mono', monospace; font-size: 12px; color: var(--muted); }
    .status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .status.active { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
    .status.pending { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25); }
    .status.suspended { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.25); }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .act-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.5px;
      transition: background .2s ease, border-color .2s ease, color .2s ease;
    }
    .act-btn:disabled { opacity: 0.5; cursor: wait; }
    .act-btn.approve { border-color: rgba(16, 185, 129, 0.4); color: #34d399; }
    .act-btn.approve:hover:not(:disabled) { background: rgba(16, 185, 129, 0.12); }
    .act-btn.suspend { border-color: rgba(239, 68, 68, 0.4); color: #f87171; }
    .act-btn.suspend:hover:not(:disabled) { background: rgba(239, 68, 68, 0.12); }
    .act-btn.reactivate { border-color: rgba(212, 184, 122, 0.4); color: var(--gold); }
    .act-btn.reactivate:hover:not(:disabled) { background: rgba(212, 184, 122, 0.12); }
    .role-select {
      background: rgba(5,20,40,0.6);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 26px 6px 10px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none' stroke='%239aa8c2' stroke-width='1.5'><path d='M1 1l4 4 4-4'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      transition: border-color .2s ease, background-color .2s ease;
    }
    .role-select:hover { border-color: var(--line-strong); }
    .role-select:focus { border-color: var(--gold); }
    .role-select option { background: var(--navy-1); color: var(--text); }
    .role-select.saving { opacity: 0.5; cursor: wait; }
    .role-static { font-size: 12px; color: var(--text); padding: 4px 0; display: inline-block; }
    .muted { color: var(--muted); }
    .toast {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: rgba(16,42,79,0.95);
      border: 1px solid rgba(212,184,122,0.4);
      color: var(--text);
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 14px;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      z-index: 999;
      backdrop-filter: blur(10px);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .empty, .loading {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
      font-size: 14px;
    }
    .denied {
      max-width: 480px;
      margin: 100px auto;
      text-align: center;
      padding: 40px 32px;
      background: linear-gradient(180deg, rgba(16,42,79,0.85), rgba(10,31,61,0.85));
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .denied h2 {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      margin: 0 0 12px;
      color: var(--cream);
    }
    .denied p { color: var(--muted); margin: 0 0 22px; font-size: 14px; }

    @media (max-width: 720px) {
      .container { padding: 24px 18px; }
      th, td { padding: 12px 12px; font-size: 13px; }
      .hide-sm { display: none; }
    }
    @media (max-width: 480px) {
      .topbar { padding: 12px 14px; flex-wrap: wrap; gap: 10px; }
      .brand img { width: 32px; height: 32px; }
      .brand-name { font-size: 13px; letter-spacing: 1.5px; }
      .topbar-actions { flex-wrap: wrap; gap: 6px; }
      .btn { padding: 7px 10px; font-size: 11px; }
      .container { padding: 18px 12px; }
      .page-head h1 { font-size: 22px; }
      .search { width: 100%; }
      th, td { padding: 10px 10px; font-size: 12px; }
      table { min-width: 560px; }
    }
    /* ============================================================
       v2 — Wise-style sidebar shell (matches agent.html)
       ============================================================ */
    .v2-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .v2-side {
      position: sticky; top: 0;
      height: 100vh; width: 240px;
      background: var(--navy-1);
      border-right: 1px solid var(--navy-3);
      display: flex; flex-direction: column;
      padding: 20px 14px 14px;
      z-index: 30;
    }
    .v2-brand {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; padding: 4px 6px 18px;
      border-bottom: 1px solid var(--navy-3);
    }
    .v2-brand-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--gold); color: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; letter-spacing: .5px;
      font-family: 'Inter', sans-serif;
    }
    .v2-brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .v2-brand-text strong { color: var(--cream); font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; }
    .v2-brand-text span { color: var(--muted); font-size: 10.5px; letter-spacing: .5px; }
    .v2-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; flex: 1; }
    .v2-nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 8px;
      color: var(--muted);
      font-size: 13.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      transition: background .15s, color .15s;
      position: relative;
    }
    .v2-nav-item:hover { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item svg { width: 18px; height: 18px; flex: none; }
    .v2-nav-item.active { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item.active::before {
      content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px;
      width: 3px; background: var(--gold); border-radius: 0 3px 3px 0;
    }
    .v2-foot { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--navy-3); }
    .v2-foot-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border-radius: 8px;
      background: transparent; border: 0;
      color: var(--muted); font-size: 12.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-align: left; cursor: pointer;
      transition: background .15s, color .15s;
      text-decoration: none;
    }
    .v2-foot-btn:hover { background: var(--navy-2); color: var(--cream); }
    .v2-foot-btn svg { width: 16px; height: 16px; flex: none; }
    .v2-main { display: flex; flex-direction: column; min-width: 0; padding: 0 0 40px; }
    .v2-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 18px 32px;
      border-bottom: 1px solid var(--navy-3);
      background: var(--navy-0);
    }
    .v2-top-user { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .v2-top-user strong { color: var(--cream); font-weight: 600; }
    .v2-top-actions { display: flex; align-items: center; gap: 10px; }
    .v2-main .page-head { padding-top: 32px; }
    .v2-main .page-head .eyebrow { color: var(--muted); letter-spacing: 1.8px; }
    @media (max-width: 1180px) {
      .v2-shell { grid-template-columns: 64px 1fr; }
      .v2-side { width: 64px; padding: 16px 8px; }
      .v2-brand-text, .v2-nav-item span, .v2-foot-btn span { display: none; }
      .v2-nav-item, .v2-foot-btn { justify-content: center; padding: 10px; }
      .v2-brand { justify-content: center; }
    }
    @media (max-width: 820px) {
      .v2-shell { grid-template-columns: 1fr; }
      .v2-side {
        position: relative; height: auto; width: 100%;
        flex-direction: row; align-items: center;
        padding: 12px 16px; border-right: 0;
        border-bottom: 1px solid var(--navy-3);
      }
      .v2-nav { flex-direction: row; margin-top: 0; gap: 4px; overflow-x: auto; }
      .v2-nav-item.active::before { display: none; }
      .v2-nav-item.active { box-shadow: inset 0 -2px 0 var(--gold); }
      .v2-foot { flex-direction: row; padding-top: 0; border-top: 0; }
      .v2-top { padding: 14px 18px; }
    }

  </style>
  <script src="theme-init.js"></script>
</head>

  <script type="module">
    import { auth, db, isAdmin, can, loadCapabilityOverrides, ROLES, DEFAULT_ROLE, roleLabel, isValidRole } from './firebase-init.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { collection, getDocs, query, orderBy, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    // Set in the auth gate; drives whether buttons render and whether the
    // role dropdown is interactive. canChangeRoles is the strongest of the
    // three — only system admin can flip roles.
    let canApprove = false;
    let canChangeRoles = false;

    const content = document.getElementById('content');
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function renderLoading() {
      content.innerHTML = `<div class="container"><div class="loading">読み込み中…</div></div>`;
    }
    function renderDenied() {
      content.innerHTML = `
        <div class="denied">
          <h2>アクセスが許可されていません</h2>
          <p>このページは管理者専用です。ダッシュボードに戻ってください。</p>
          <a class="btn" href="agent.html">ダッシュボードへ</a>
        </div>`;
    }

    function fmtDate(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString('ja-JP', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    let allAgents = [];

    function actionsFor(a) {
      if (!canApprove) return '<span class="muted">—</span>';
      const s = a.status || 'active';
      if (s === 'pending') return `
        <button class="act-btn approve" data-uid="${esc(a.uid)}" data-action="approve">承認</button>
        <button class="act-btn suspend" data-uid="${esc(a.uid)}" data-action="suspend">却下</button>`;
      if (s === 'active') return `
        <button class="act-btn suspend" data-uid="${esc(a.uid)}" data-action="suspend">停止</button>`;
      if (s === 'suspended') return `
        <button class="act-btn reactivate" data-uid="${esc(a.uid)}" data-action="approve">再有効化</button>`;
      return '';
    }

    function renderTable(filter = '') {
      const f = filter.trim().toLowerCase();
      const rows = allAgents.filter(a =>
        !f || `${a.firstName} ${a.lastName} ${a.email} ${a.phone || ''}`.toLowerCase().includes(f)
      );
      const tbody = rows.length ? rows.map(a => {
        const status = a.status || 'active';
        const role = isValidRole(a.role) ? a.role : DEFAULT_ROLE;
        const roleCell = canChangeRoles
          ? `<select class="role-select" data-uid="${esc(a.uid)}" aria-label="Role">${
              ROLES.map(r =>
                `<option value="${r}"${r === role ? ' selected' : ''}>${esc(roleLabel(r, 'ja'))}</option>`
              ).join('')
            }</select>`
          : `<span class="role-static">${esc(roleLabel(role, 'ja'))}</span>`;
        return `
        <tr data-uid="${esc(a.uid)}">
          <td><div class="name">${esc(a.firstName)} ${esc(a.lastName)}</div></td>
          <td class="email">${esc(a.email)}</td>
          <td class="hide-sm">${esc(a.phone || '—')}</td>
          <td>${roleCell}</td>
          <td class="hide-sm">${fmtDate(a.createdAt)}</td>
          <td><span class="status ${status}">${status}</span></td>
          <td><div class="row-actions">${actionsFor(a)}</div></td>
        </tr>`;
      }).join('')
        : `<tr><td colspan="7" class="empty">該当するエージェントが見つかりません。</td></tr>`;
      document.getElementById('agentRows').innerHTML = tbody;
      document.getElementById('countShown').textContent = rows.length;
      document.querySelectorAll('.act-btn').forEach(btn => {
        btn.addEventListener('click', () => handleAction(btn));
      });
      document.querySelectorAll('.role-select').forEach(sel => {
        sel.addEventListener('change', () => handleRoleChange(sel));
      });
    }

    async function handleRoleChange(sel) {
      const uid = sel.getAttribute('data-uid');
      const newRole = sel.value;
      if (!isValidRole(newRole)) return;
      sel.classList.add('saving');
      sel.disabled = true;
      try {
        await updateDoc(doc(db, 'agents', uid), { role: newRole });
        const idx = allAgents.findIndex(a => a.uid === uid);
        if (idx >= 0) allAgents[idx].role = newRole;
        showToast('役割を更新しました。');
      } catch (err) {
        showToast('エラー: ' + (err.message || 'もう一度お試しください'));
      } finally {
        sel.classList.remove('saving');
        sel.disabled = false;
      }
    }

    async function handleAction(btn) {
      const uid = btn.getAttribute('data-uid');
      const action = btn.getAttribute('data-action');
      const newStatus = action === 'approve' ? 'active' : 'suspended';
      btn.disabled = true;
      try {
        await updateDoc(doc(db, 'agents', uid), { status: newStatus });
        const idx = allAgents.findIndex(a => a.uid === uid);
        if (idx >= 0) allAgents[idx].status = newStatus;
        renderTable(document.getElementById('searchInput').value);
        showToast(action === 'approve' ? 'エージェントを承認しました。' : 'エージェントを停止しました。');
      } catch (err) {
        showToast('エラー: ' + (err.message || 'もう一度お試しください'));
        btn.disabled = false;
      }
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    async function loadAgents() {
      content.innerHTML = `
        <div class="container">
          <div class="page-head">
            <div>
              <h1>Registered Agents</h1>
              <div class="count"><strong id="countShown">0</strong> / <strong id="countTotal">0</strong> エージェント</div>
            </div>
            <input class="search" id="searchInput" placeholder="名前・メール・電話で検索…" />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th class="hide-sm">Phone</th>
                  <th>Role</th>
                  <th class="hide-sm">Registered</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="agentRows">
                <tr><td colspan="7" class="loading">読み込み中…</td></tr>
              </tbody>
            </table>
          </div>
        </div>`;
      try {
        const q = query(collection(db, 'agents'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        allAgents = snap.docs.map(d => d.data());
        document.getElementById('countTotal').textContent = allAgents.length;
        renderTable();
        document.getElementById('searchInput').addEventListener('input', e => renderTable(e.target.value));
      } catch (err) {
        document.getElementById('agentRows').innerHTML =
          `<tr><td colspan="5" class="empty">エラー: ${esc(err.message)}</td></tr>`;
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      await loadCapabilityOverrides(db);
      let role = null;
      try {
        const snap = await getDoc(doc(db, 'agents', user.uid));
        if (snap.exists()) role = snap.data().role || null;
      } catch (e) {}
      // Per Balraj — Registered Agents page is admin-only. Use 'changeRoles'
      // (admin) as the page gate, not the broader 'viewAllAgents'.
      if (!can(role, 'changeRoles', user.email)) { renderDenied(); return; }
      canApprove      = can(role, 'approveAgents', user.email);
      canChangeRoles  = can(role, 'changeRoles',   user.email);
      renderLoading();
      loadAgents();
    });

    window.logout = async function() {
      try { await signOut(auth); } catch (e) {}
      window.location.href = 'index.html';
    };
  </script>
  <script src="glass-fx.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database — Exceed Real Estate</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <!-- PWA: manifest, theme color, iOS install support. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a1f3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exceed">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script src="pwa-init.js" defer></script>
  <script src="theme-init.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="liquid.css">
  <style>
    :root { --navy-0: #15171c; --navy-1: #1c1f26; --navy-2: #262a33; --navy-3: #2f3340; --line: rgba(255,255,255,0.06); --line-strong: rgba(255,255,255,0.12); --text: #f5f7fa; --muted: #8a91a3; --gold: #ffd84d; --cream: #f5f7fa; --green:#5cc98f; --red:#ff6b6b; --radius:14px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--navy-0); }
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background: var(--navy-0);
      color: var(--text); min-height: 100vh;
    }

    .topbar { display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px); background: rgba(5,20,40,0.7);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .brand img { width: 40px; height: 40px; border-radius: 8px; }
    .brand-name { font-family: 'Inter', 'Noto Sans JP', sans-serif; letter-spacing: 2px; font-weight: 600; }
    .brand-name span { color: var(--gold); font-weight: 400; }
    .topbar-right { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
    .icon-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-family: inherit; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
      transition: background .2s; display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); }
    .icon-btn svg { width: 14px; height: 14px; }
    .lang-toggle { display: inline-flex; gap: 4px; background: rgba(255,255,255,0.04); padding: 4px; border-radius: 999px; border: 1px solid var(--line); }
    .lang-toggle button { background: none; border: 0; padding: 5px 12px; color: var(--muted); font-size: 11px; letter-spacing: 1px; cursor: pointer; border-radius: 999px; font-family: inherit; }
    .lang-toggle button.active { background: var(--gold); color: var(--navy-1); font-weight: 700; }

    .page-head { max-width: 1200px; margin: 0 auto; padding: 32px 32px 0; }
    .page-head .eyebrow { color: var(--gold); letter-spacing: 5px; font-size: 11px; text-transform: uppercase; margin-bottom: 10px; font-weight: 700; }
    .page-head h1 { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-weight: 600; font-size: clamp(28px, 4vw, 42px); margin: 0 0 8px; }
    .page-head .lede { color: var(--muted); font-size: 14px; max-width: 760px; margin: 0; line-height: 1.6; }

    .global-search {
      max-width: 1200px; margin: 22px auto 0; padding: 0 32px;
      display: flex; gap: 12px; align-items: center;
    }
    .global-search input {
      flex: 1; background: rgba(5,20,40,0.7); border: 1px solid var(--line);
      color: var(--text); border-radius: 10px; padding: 12px 16px;
      font-family: inherit; font-size: 14px;
    }
    .global-search input:focus { outline: none; border-color: var(--gold); }

    /* ===== Top tabs ===== */
    .top-tabs-wrap {
      max-width: 1200px; margin: 24px auto 0; padding: 0 32px;
      border-bottom: 1px solid var(--line);
    }
    .top-tabs { display: flex; gap: 4px; overflow-x: auto; }
    .top-tab {
      background: transparent; border: 0;
      padding: 14px 20px; color: var(--muted);
      font-family: inherit; font-size: 14px; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase;
      cursor: pointer; position: relative;
      white-space: nowrap;
    }
    .top-tab:hover { color: var(--cream); }
    .top-tab.active { color: var(--gold); }
    .top-tab.active::after {
      content: ''; position: absolute; bottom: -1px; left: 14px; right: 14px;
      height: 2px; background: var(--gold); border-radius: 2px;
    }
    .top-tab .count {
      display: inline-block; margin-left: 8px; padding: 2px 8px;
      border-radius: 999px; background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--muted);
      text-transform: none;
    }
    .top-tab.active .count {
      background: rgba(212,184,122,0.16); color: var(--gold);
      border-color: rgba(212,184,122,0.4);
    }

    /* ===== Sub-categories ===== */
    main { max-width: 1200px; margin: 0 auto; padding: 24px 32px 80px; }
    .subcats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
    .subcat {
      padding: 8px 14px; border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: inherit; font-size: 12px; font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .subcat:hover { color: var(--cream); border-color: var(--line-strong); }
    .subcat.active {
      background: rgba(212,184,122,0.14); color: var(--gold);
      border-color: rgba(212,184,122,0.4);
    }
    .subcat .count {
      display: inline-block; margin-left: 6px;
      font-size: 10.5px; opacity: 0.7;
    }

    /* Developer hierarchy: 3 rows of chips stacked */
    .dev-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    .dev-row::before {
      font-size: 10px; font-weight: 700; letter-spacing: 1.6px;
      text-transform: uppercase; color: var(--muted);
      min-width: 88px; padding-right: 8px;
    }
    html[lang="en"] .dev-row-developers::before { content: 'Developer'; }
    html[lang="en"] .dev-row-projects::before   { content: 'Project'; }
    html[lang="en"] .dev-row-categories::before { content: 'Category'; }
    html[lang="ja"] .dev-row-developers::before { content: 'デベロッパー'; min-width: 100px; }
    html[lang="ja"] .dev-row-projects::before   { content: 'プロジェクト'; min-width: 100px; }
    html[lang="ja"] .dev-row-categories::before { content: 'カテゴリ'; min-width: 100px; }
    .dev-chip.active  { background: rgba(255,216,77,0.18); color: var(--gold); border-color: rgba(255,216,77,0.45); }
    .proj-chip.active { background: rgba(255,216,77,0.10); color: var(--cream); border-color: rgba(255,216,77,0.30); }
    .cat-chip.active  { background: rgba(255,216,77,0.10); color: var(--cream); border-color: rgba(255,216,77,0.30); }
    @media (max-width: 720px) {
      .dev-row::before { min-width: 100%; padding-bottom: 4px; }
    }

    /* ===== Upload card ===== */
    .upload-card {
      background: linear-gradient(180deg, rgba(16,42,79,0.6), rgba(10,31,61,0.6));
      border: 1px dashed rgba(212,184,122,0.4);
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 22px;
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
      transition: border-color .15s, background .15s;
    }
    .upload-card.drag {
      border-color: var(--gold);
      background: rgba(212,184,122,0.08);
    }
    .upload-icon {
      width: 44px; height: 44px; border-radius: 10px;
      background: rgba(212,184,122,0.16);
      border: 1px solid rgba(212,184,122,0.4);
      color: var(--gold);
      display: grid; place-items: center;
      flex: 0 0 44px;
    }
    .upload-icon svg { width: 22px; height: 22px; }
    .upload-text { flex: 1; min-width: 0; }
    .upload-text strong { display: block; color: var(--cream); font-size: 14px; font-weight: 700; }
    .upload-text .sub { color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 4px; }
    .upload-btn {
      padding: 11px 20px; border-radius: 9px; border: 0;
      background: linear-gradient(135deg, var(--cream), var(--gold));
      color: var(--navy-1);
      font-family: inherit; font-size: 12px; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase;
      cursor: pointer;
    }
    .upload-btn:disabled { opacity: 0.55; cursor: wait; }
    .upload-progress {
      width: 100%; height: 4px; margin-top: 10px;
      background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden;
      display: none;
    }
    .upload-progress .bar {
      height: 100%; width: 0;
      background: linear-gradient(90deg, var(--gold), var(--cream));
      transition: width .15s ease;
    }

    /* ===== File list ===== */
    .file-list { display: flex; flex-direction: column; gap: 8px; }
    .file-row {
      display: grid;
      grid-template-columns: 36px 1fr auto auto;
      gap: 14px; align-items: center;
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .file-row:hover { border-color: var(--line-strong); background: rgba(255,255,255,0.05); }
    .file-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: rgba(212,184,122,0.10);
      border: 1px solid rgba(212,184,122,0.3);
      color: var(--gold);
      display: grid; place-items: center;
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    }
    .file-meta { min-width: 0; }
    .file-name {
      color: var(--cream); font-weight: 600; font-size: 14px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
    .file-actions { display: flex; gap: 6px; }
    .action-btn {
      background: transparent; border: 1px solid var(--line);
      color: var(--muted); width: 32px; height: 32px;
      border-radius: 8px; cursor: pointer;
      display: grid; place-items: center;
    }
    .action-btn:hover { color: var(--cream); border-color: var(--line-strong); }
    .action-btn.danger:hover { color: var(--red); border-color: rgba(255,107,107,0.5); }
    .action-btn svg { width: 16px; height: 16px; }
    .file-row a.action-btn { text-decoration: none; }

    .empty-state {
      text-align: center; color: var(--muted);
      padding: 56px 20px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      font-size: 13.5px; line-height: 1.6;
    }
    .empty-state strong { color: var(--cream); font-weight: 600; display: block; margin-bottom: 6px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(10,31,61,0.96); border: 1px solid var(--gold); color: var(--cream);
      padding: 12px 22px; border-radius: 10px; font-size: 13px;
      opacity: 0; pointer-events: none; transition: all .25s;
      z-index: 50; max-width: calc(100vw - 32px);
      backdrop-filter: blur(8px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--red); }

    @media (max-width: 700px) {
      .topbar { padding: 12px 18px; flex-wrap: wrap; gap: 10px; }
      .page-head, .global-search, .top-tabs-wrap, main { padding-left: 18px; padding-right: 18px; }
      .top-tab { padding: 12px 14px; font-size: 13px; }
      .upload-card { padding: 18px; }
      .file-row { grid-template-columns: 32px 1fr; grid-row-gap: 8px; }
      .file-actions { grid-column: 1 / -1; justify-content: flex-end; }
      .file-icon { width: 32px; height: 32px; }
    }
    /* ============================================================
       v2 — Wise-style sidebar shell (matches agent.html)
       ============================================================ */
    .v2-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .v2-side {
      position: sticky; top: 0;
      height: 100vh; width: 240px;
      background: var(--navy-1);
      border-right: 1px solid var(--navy-3);
      display: flex; flex-direction: column;
      padding: 20px 14px 14px;
      z-index: 30;
    }
    .v2-brand {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; padding: 4px 6px 18px;
      border-bottom: 1px solid var(--navy-3);
    }
    .v2-brand-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--gold); color: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; letter-spacing: .5px;
      font-family: 'Inter', sans-serif;
    }
    .v2-brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .v2-brand-text strong { color: var(--cream); font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; }
    .v2-brand-text span { color: var(--muted); font-size: 10.5px; letter-spacing: .5px; }
    .v2-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; flex: 1; }
    .v2-nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 8px;
      color: var(--muted);
      font-size: 13.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      transition: background .15s, color .15s;
      position: relative;
    }
    .v2-nav-item:hover { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item svg { width: 18px; height: 18px; flex: none; }
    .v2-nav-item.active { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item.active::before {
      content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px;
      width: 3px; background: var(--gold); border-radius: 0 3px 3px 0;
    }
    .v2-foot { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--navy-3); }
    .v2-foot-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border-radius: 8px;
      background: transparent; border: 0;
      color: var(--muted); font-size: 12.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-align: left; cursor: pointer;
      transition: background .15s, color .15s;
      text-decoration: none;
    }
    .v2-foot-btn:hover { background: var(--navy-2); color: var(--cream); }
    .v2-foot-btn svg { width: 16px; height: 16px; flex: none; }
    .v2-main { display: flex; flex-direction: column; min-width: 0; padding: 0 0 40px; }
    .v2-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 18px 32px;
      border-bottom: 1px solid var(--navy-3);
      background: var(--navy-0);
    }
    .v2-top-user { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .v2-top-user strong { color: var(--cream); font-weight: 600; }
    .v2-top-actions { display: flex; align-items: center; gap: 10px; }
    .v2-main .page-head { padding-top: 32px; }
    .v2-main .page-head .eyebrow { color: var(--muted); letter-spacing: 1.8px; }
    @media (max-width: 1180px) {
      .v2-shell { grid-template-columns: 64px 1fr; }
      .v2-side { width: 64px; padding: 16px 8px; }
      .v2-brand-text, .v2-nav-item span, .v2-foot-btn span { display: none; }
      .v2-nav-item, .v2-foot-btn { justify-content: center; padding: 10px; }
      .v2-brand { justify-content: center; }
    }
    @media (max-width: 820px) {
      .v2-shell { grid-template-columns: 1fr; }
      .v2-side {
        position: relative; height: auto; width: 100%;
        flex-direction: row; align-items: center;
        padding: 12px 16px; border-right: 0;
        border-bottom: 1px solid var(--navy-3);
      }
      .v2-nav { flex-direction: row; margin-top: 0; gap: 4px; overflow-x: auto; }
      .v2-nav-item.active::before { display: none; }
      .v2-nav-item.active { box-shadow: inset 0 -2px 0 var(--gold); }
      .v2-foot { flex-direction: row; padding-top: 0; border-top: 0; }
      .v2-top { padding: 14px 18px; }
    }

  </style>
</head>

        </div>

          <div class="lang-toggle" id="langToggle">
            <span class="pill" id="langPill"></span>
            <button data-lang="ja" class="active">日本語</button>
            <button data-lang="en">EN</button>
          </div>

      </header>
  <div class="bg-skyline"></div>
  <div class="bg-overlay"></div>

  <div class="page-head">
    <div class="eyebrow" data-i18n="eyebrow">Database</div>
    <h1 data-i18n="title">データベース</h1>
    <p class="lede" data-i18n="lede">社内資料・デベロッパー資料・ロンボク・日本の資料をここに保存。検索バーで横断検索、または各タブから閲覧。</p>

    <input type="search" id="searchInput" placeholder="ファイル名で検索…" data-i18n-attr-placeholder="searchPh" />
  </div>

  <div class="top-tabs-wrap">
    <nav class="top-tabs" id="topTabs"></nav>
  </div>

  <main>
    <div class="subcats" id="subcats"></div>

    <div class="upload-card" id="uploadCard">
      <div class="upload-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <div class="upload-text">
        <strong data-i18n="dropTitle">ファイルをドラッグ&ドロップ または「アップロード」をクリック</strong>
        <span class="sub" data-i18n="dropSub">PDF・画像・ドキュメント・スライドなど 最大 50MB</span>
        <div class="upload-progress" id="uploadProgress"><div class="bar"></div></div>
      </div>
      <button class="upload-btn" id="uploadBtn">
        <span data-i18n="uploadBtn">アップロード</span>
      </button>
      <input type="file" id="fileInput" hidden multiple />
    </div>

    <div class="file-list" id="fileList">
      <div class="empty-state">
        <strong data-i18n="loadingTitle">読み込み中…</strong>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
    </div><!-- /v2-main -->
  </div><!-- /v2-shell -->

  <script type="module">
    import { auth, db, storage, isAdmin } from './firebase-init.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import {
      doc, getDoc, addDoc, deleteDoc, collection, query,
      orderBy, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
    import {
      ref as sref, uploadBytesResumable, getDownloadURL, deleteObject
    } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";

    /* ===== Sections + sub-categories ===== */
    const SECTIONS = [
      {
        key: 'internal',  label: 'Internal',  labelJa: '社内',
        subs: [
          { key: 'files',  label: 'Files',  labelJa: 'ファイル' },
          { key: 'forms',  label: 'Forms',  labelJa: 'フォーム' },
          { key: 'media',  label: 'Media',  labelJa: 'メディア' }
        ]
      },
      {
        key: 'developer', label: 'Developer', labelJa: 'デベロッパー',
        // Hierarchy is dynamic: Developer → Project → Category (see _devSlug/_devProject/_devCategory).
        // We still keep a 'subs' array so the existing renderTabs counter works, but only the 'all' bucket is shown.
        subs: [
          { key: 'all', label: 'All', labelJa: 'すべて' }
        ]
      },
      {
        key: 'lombok',    label: 'Lombok',    labelJa: 'ロンボク',
        subs: [
          { key: 'all',       label: 'All' },
          { key: 'brochures', label: 'Brochures', labelJa: 'ブローシャー' },
          { key: 'photos',    label: 'Photos',    labelJa: '写真' },
          { key: 'decks',     label: 'Decks',     labelJa: '資料' }
        ]
      },
      {
        key: 'ayuva', label: 'AYUVA', labelJa: 'AYUVA',
        subs: [
          { key: 'all',       label: 'All' },
          { key: 'renders',   label: 'Renders',    labelJa: 'レンダー' },
          { key: 'brochures', label: 'Brochures',  labelJa: 'ブローシャー' },
          { key: 'docs',      label: 'Docs',       labelJa: 'ドキュメント' }
        ]
      },
      {
        key: 'takumi', label: 'Takumi', labelJa: '匠',
        subs: [
          { key: 'all',       label: 'All' },
          { key: 'photos',    label: 'Photos',     labelJa: '写真' },
          { key: 'brochures', label: 'Brochures',  labelJa: 'ブローシャー' },
          { key: 'docs',      label: 'Docs',       labelJa: 'ドキュメント' }
        ]
      }
    ];

    /* ===== i18n ===== */
    const I18N = {
      ja: {
        eyebrow: 'Database',
        title: 'データベース',
        lede: '社内資料・デベロッパー資料・ロンボク・日本の資料をここに保存。検索バーで横断検索、または各タブから閲覧。',
        searchPh: 'ファイル名で検索…',
        back: 'ダッシュボード', hello: 'こんにちは、',
        dropTitle: 'ファイルをドラッグ&ドロップ または「アップロード」をクリック',
        dropSub: 'PDF・画像・ドキュメント・スライドなど 最大 50MB',
        uploadBtn: 'アップロード',
        uploading: 'アップロード中…',
        loadingTitle: '読み込み中…',
        emptyTitle: 'まだファイルがありません',
        emptyBody: '上の「アップロード」ボタンか、ファイルをドラッグ&ドロップして追加してください。',
        download: 'ダウンロード', deleteAct: '削除',
        confirmDelete: 'このファイルを削除しますか？',
        toastUploaded: '✓ アップロード完了',
        toastDeleted: '✓ 削除しました',
        toastTooBig: 'ファイルサイズが大きすぎます (最大 50MB)',
        toastUploadFailed: 'アップロード失敗: ',
        toastDeleteFailed: '削除失敗: ',
        uploadedBy: '— ',
        devAllProjects: 'すべてのプロジェクト',
        catAll: 'すべて', catBrochure: 'ブローシャー', catRender: 'レンダー',
        catInventory: '在庫', catPaymentPlan: '支払いプラン',
        catFloorPlan: '間取り図', catFactSheet: 'ファクトシート',
        catLogo: 'ロゴ', catImage: '画像', catVideo: '動画',
        catOther: 'その他',
        whatsappRequest: 'WhatsApp で依頼',
        noDevsTitle: 'まだデベロッパーが登録されていません',
        noDevsBody: '管理者が /developers/{slug} ドキュメントを追加すると、ここに表示されます。',
        emptyDevTitle: 'このカテゴリのファイルはありません',
        emptyDevBody: '別のプロジェクトやカテゴリを試すか、開発者に WhatsApp で送ってもらいましょう。'
      },
      en: {
        eyebrow: 'Database',
        title: 'Database',
        lede: 'Internal company files, developer brochures, Lombok and Japan project assets — all in one place. Search across or browse by tab.',
        searchPh: 'Search by filename…',
        back: 'Dashboard', hello: 'Hello, ',
        dropTitle: 'Drag & drop a file, or click Upload',
        dropSub: 'PDFs, images, docs, slides — up to 50 MB each',
        uploadBtn: 'Upload',
        uploading: 'Uploading…',
        loadingTitle: 'Loading…',
        emptyTitle: 'No files yet',
        emptyBody: 'Use the Upload button above or drag a file onto this card to get started.',
        download: 'Download', deleteAct: 'Delete',
        confirmDelete: 'Delete this file?',
        toastUploaded: '✓ Upload complete',
        toastDeleted: '✓ Deleted',
        toastTooBig: 'File too large (50 MB max)',
        toastUploadFailed: 'Upload failed: ',
        toastDeleteFailed: 'Delete failed: ',
        uploadedBy: 'by ',
        devAllProjects: 'All projects',
        catAll: 'All', catBrochure: 'Brochures', catRender: 'Renders',
        catInventory: 'Inventory', catPaymentPlan: 'Payment plans',
        catFloorPlan: 'Floor plans', catFactSheet: 'Fact sheets',
        catLogo: 'Logos', catImage: 'Images', catVideo: 'Videos',
        catOther: 'Other',
        whatsappRequest: 'Request via WhatsApp',
        noDevsTitle: 'No developers registered yet',
        noDevsBody: 'Admin adds /developers/{slug} docs and they\'ll appear here.',
        emptyDevTitle: 'Nothing in this category yet',
        emptyDevBody: 'Try another project or category, or message the developer on WhatsApp.'
      }
    };
    let currentLang = 'ja';
    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      const dict = I18N[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (dict[k]) el.textContent = dict[k];
      });
      document.querySelectorAll('[data-i18n-attr-placeholder]').forEach(el => {
        const k = el.getAttribute('data-i18n-attr-placeholder');
        if (dict[k]) el.placeholder = dict[k];
      });
      document.querySelectorAll('#langToggle button').forEach(b =>
        b.classList.toggle('active', b.dataset.lang === lang));
      renderTabs(); renderSubcats(); renderFiles();
    }
    document.querySelectorAll('#langToggle button').forEach(b =>
      b.addEventListener('click', () => setLang(b.dataset.lang)));

    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.toggle('error', !!isErr);
      t.classList.add('show');
      clearTimeout(t._tm);
      t._tm = setTimeout(() => t.classList.remove('show'), 3000);
    }

    /* ===== Developer-hierarchy taxonomy =====
       The AI classifier writes aiCategory (= subcategory) using these keys. */
    const CATEGORIES = [
      { key: 'all',          i18n: 'catAll'         },
      { key: 'brochure',     i18n: 'catBrochure'    },
      { key: 'render',       i18n: 'catRender'      },
      { key: 'floor_plan',   i18n: 'catFloorPlan'   },
      { key: 'inventory',    i18n: 'catInventory'   },
      { key: 'payment_plan', i18n: 'catPaymentPlan' },
      { key: 'fact_sheet',   i18n: 'catFactSheet'   },
      { key: 'logo',         i18n: 'catLogo'        },
      { key: 'image',        i18n: 'catImage'       },
      { key: 'video',        i18n: 'catVideo'       },
      { key: 'other',        i18n: 'catOther'       }
    ];

    /* ===== State ===== */
    let _me = null;
    let _isAdminUser = false;
    let _files = [];                 // live from /databaseFiles
    let _developers = [];            // live from /developers (active=true)
    let _activeSection = 'internal';
    let _activeSub = 'files';
    let _searchQuery = '';
    let _devSlug = null;             // Developer hierarchy: selected developer
    let _devProject = 'all';         // Developer hierarchy: selected project ('all' = no filter)
    let _devCategory = 'all';        // Developer hierarchy: selected category

    function sectionDef(key) { return SECTIONS.find(s => s.key === key); }
    function subDef(sectionKey, subKey) {
      const sec = sectionDef(sectionKey);
      return sec?.subs.find(s => s.key === subKey);
    }
    function subLabel(sub) {
      return currentLang === 'ja' ? (sub.labelJa || sub.label) : sub.label;
    }
    function sectionLabel(sec) {
      return currentLang === 'ja' ? (sec.labelJa || sec.label) : sec.label;
    }

    function countForSection(secKey) {
      return _files.filter(f => f.section === secKey).length;
    }
    function countForSub(secKey, subKey) {
      if (subKey === 'all') return countForSection(secKey);
      return _files.filter(f => f.section === secKey && f.subcategory === subKey).length;
    }

    function renderTabs() {
      const wrap = document.getElementById('topTabs');
      wrap.innerHTML = SECTIONS.map(sec => {
        const isActive = sec.key === _activeSection;
        return `<button class="top-tab ${isActive ? 'active' : ''}" data-section="${sec.key}">
          ${sectionLabel(sec)}
          <span class="count">${countForSection(sec.key)}</span>
        </button>`;
      }).join('');
      wrap.querySelectorAll('button').forEach(b =>
        b.addEventListener('click', () => {
          _activeSection = b.dataset.section;
          // Default sub on switch — first sub in the section.
          const sec = sectionDef(_activeSection);
          _activeSub = sec.subs[0].key;
          renderTabs(); renderSubcats(); renderFiles();
        })
      );
    }

    function renderSubcats() {
      if (_activeSection === 'developer') return renderDeveloperHierarchy();
      const sec = sectionDef(_activeSection);
      const wrap = document.getElementById('subcats');
      wrap.innerHTML = sec.subs.map(s => {
        const isActive = s.key === _activeSub;
        const c = countForSub(_activeSection, s.key);
        return `<button class="subcat ${isActive ? 'active' : ''}" data-sub="${s.key}">
          ${subLabel(s)}<span class="count">${c}</span>
        </button>`;
      }).join('');
      wrap.querySelectorAll('button').forEach(b =>
        b.addEventListener('click', () => {
          _activeSub = b.dataset.sub;
          renderSubcats(); renderFiles();
        })
      );
    }

    /* ===== Developer hierarchy (Developer → Project → Category) ===== */
    function devFilesFor(slug) {
      return _files.filter(f => f.section === 'developer' && f.developerSlug === slug);
    }
    function projectsForActiveDev() {
      if (!_devSlug) return [];
      const map = new Map();
      devFilesFor(_devSlug).forEach(f => {
        const p = f.project || 'General';
        map.set(p, (map.get(p) || 0) + 1);
      });
      return [...map.entries()]
        .sort((a, b) => a[0].localeCompare(b[0]))
        .map(([name, count]) => ({ name, count }));
    }
    function categoryCount(catKey) {
      let list = devFilesFor(_devSlug);
      if (_devProject !== 'all') list = list.filter(f => (f.project || 'General') === _devProject);
      if (catKey === 'all') return list.length;
      return list.filter(f => (f.aiCategory || f.subcategory) === catKey).length;
    }

    function renderDeveloperHierarchy() {
      const wrap = document.getElementById('subcats');
      const dict = I18N[currentLang];

      if (!_developers.length) {
        wrap.innerHTML = `<div class="empty-state" style="margin:0;padding:18px;text-align:left;width:100%">
          <strong>${dict.noDevsTitle}</strong><span>${dict.noDevsBody}</span>
        </div>`;
        return;
      }
      if (!_devSlug) _devSlug = _developers[0].slug;

      // Row 1: developer chips
      const devChips = _developers.map(d => {
        const isActive = d.slug === _devSlug;
        const count = devFilesFor(d.slug).length;
        return `<button class="subcat dev-chip ${isActive ? 'active' : ''}" data-dev="${d.slug}">
          ${d.name}<span class="count">${count}</span>
        </button>`;
      }).join('');

      // Row 2: project chips for the active developer
      const projects = projectsForActiveDev();
      const totalProj = devFilesFor(_devSlug).length;
      const projChips =
        `<button class="subcat proj-chip ${_devProject === 'all' ? 'active' : ''}" data-proj="all">
           ${dict.devAllProjects}<span class="count">${totalProj}</span>
         </button>` +
        projects.map(p => `<button class="subcat proj-chip ${_devProject === p.name ? 'active' : ''}" data-proj="${p.name.replace(/"/g, '&quot;')}">
          ${p.name}<span class="count">${p.count}</span>
        </button>`).join('');

      // Row 3: category chips
      const catChips = CATEGORIES.map(c => {
        const isActive = c.key === _devCategory;
        const count = categoryCount(c.key);
        return `<button class="subcat cat-chip ${isActive ? 'active' : ''}" data-cat="${c.key}">
          ${dict[c.i18n]}<span class="count">${count}</span>
        </button>`;
      }).join('');

      wrap.innerHTML = `
        <div class="dev-row dev-row-developers">${devChips}</div>
        <div class="dev-row dev-row-projects">${projChips}</div>
        <div class="dev-row dev-row-categories">${catChips}</div>
      `;

      wrap.querySelectorAll('button[data-dev]').forEach(b =>
        b.addEventListener('click', () => {
          _devSlug = b.dataset.dev; _devProject = 'all'; _devCategory = 'all';
          renderDeveloperHierarchy(); renderFiles();
        })
      );
      wrap.querySelectorAll('button[data-proj]').forEach(b =>
        b.addEventListener('click', () => {
          _devProject = b.dataset.proj;
          renderDeveloperHierarchy(); renderFiles();
        })
      );
      wrap.querySelectorAll('button[data-cat]').forEach(b =>
        b.addEventListener('click', () => {
          _devCategory = b.dataset.cat;
          renderDeveloperHierarchy(); renderFiles();
        })
      );
    }

    function fmtBytes(n) {
      if (!n || n < 1024) return (n || 0) + ' B';
      if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }
    function fmtDate(ts) {
      if (!ts) return '';
      try {
        const d = ts.toDate ? ts.toDate() : new Date(ts);
        return d.toLocaleDateString(currentLang === 'ja' ? 'ja-JP' : 'en-GB',
          { year: 'numeric', month: 'short', day: 'numeric' });
      } catch (_) { return ''; }
    }
    function extOf(name) {
      const m = (name || '').match(/\.([a-zA-Z0-9]{1,5})$/);
      return m ? m[1].toUpperCase() : 'FILE';
    }

    function renderFiles() {
      const list = document.getElementById('fileList');
      const dict = I18N[currentLang];
      const q = _searchQuery.trim().toLowerCase();
      const inDev = _activeSection === 'developer';
      const filtered = _files.filter(f => {
        if (f.section !== _activeSection) return false;
        if (inDev) {
          if (_devSlug && f.developerSlug !== _devSlug) return false;
          if (_devProject !== 'all' && (f.project || 'General') !== _devProject) return false;
          if (_devCategory !== 'all' && (f.aiCategory || f.subcategory) !== _devCategory) return false;
        } else {
          if (_activeSub !== 'all' && f.subcategory !== _activeSub) return false;
        }
        if (q && !(f.name || '').toLowerCase().includes(q)) return false;
        return true;
      });
      if (!filtered.length) {
        if (inDev) {
          const dev = _developers.find(d => d.slug === _devSlug);
          const wa = dev?.whatsapp;
          let waBtn = '';
          if (wa) {
            const projTxt = _devProject !== 'all' ? _devProject + ' ' : '';
            const catKey = _devCategory !== 'all' ? _devCategory : '';
            const catLabel = catKey ? (dict['cat' + catKey.split('_').map(s => s[0].toUpperCase() + s.slice(1)).join('')] || catKey) : '';
            const msg = currentLang === 'ja'
              ? `${dev.name} さん、${projTxt}${catLabel} の最新版を共有のドライブにアップロードしていただけますか？`
              : `Hi ${dev.name}, could you upload the latest ${projTxt}${catLabel} to the shared Drive folder?`;
            const url = `https://wa.me/${String(wa).replace(/[^0-9]/g, '')}?text=${encodeURIComponent(msg)}`;
            waBtn = `<a class="action-btn" href="${url}" target="_blank" rel="noopener" style="background:#25d366;color:#0a3a18;border-color:transparent;padding:9px 16px;border-radius:999px;display:inline-flex;gap:8px;align-items:center;font-weight:600;margin-top:14px;">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
              ${dict.whatsappRequest}
            </a>`;
          }
          list.innerHTML = `<div class="empty-state">
            <strong>${dict.emptyDevTitle}</strong>
            <span>${dict.emptyDevBody}</span>
            ${waBtn}
          </div>`;
          return;
        }
        list.innerHTML = `<div class="empty-state">
          <strong>${dict.emptyTitle}</strong>
          <span>${dict.emptyBody}</span>
        </div>`;
        return;
      }
      list.innerHTML = filtered.map(f => {
        const canDelete = _isAdminUser || (f.uploadedBy && _me && f.uploadedBy === _me.uid);
        const ext = extOf(f.name);
        const sub = `${dict.uploadedBy}${(f.uploadedByName || f.uploadedByEmail || '').replace(/</g,'&lt;')} · ${fmtDate(f.createdAt)} · ${fmtBytes(f.size)}`;
        return `<div class="file-row" data-id="${f.id}">
          <div class="file-icon">${ext}</div>
          <div class="file-meta">
            <div class="file-name">${(f.name || '').replace(/</g,'&lt;')}</div>
            <div class="file-sub">${sub}</div>
          </div>
          <div class="file-actions">
            <a class="action-btn" href="${f.downloadUrl}" target="_blank" rel="noopener" title="${dict.download}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </a>
            ${canDelete ? `<button class="action-btn danger" data-del="${f.id}" title="${dict.deleteAct}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>` : ''}
          </div>
        </div>`;
      }).join('');
      list.querySelectorAll('button[data-del]').forEach(btn =>
        btn.addEventListener('click', () => deleteFile(btn.dataset.del))
      );
    }

    /* ===== Search ===== */
    document.getElementById('searchInput').addEventListener('input', (e) => {
      _searchQuery = e.target.value || '';
      renderFiles();
    });

    /* ===== Subscribe to file index ===== */
    function subscribeFiles() {
      const q = query(collection(db, 'databaseFiles'), orderBy('createdAt', 'desc'));
      onSnapshot(q, (snap) => {
        _files = [];
        snap.forEach(d => _files.push({ id: d.id, ...d.data() }));
        renderTabs(); renderSubcats(); renderFiles();
      }, (err) => {
        console.error('[database] onSnapshot', err);
        showToast('読み込みに失敗しました: ' + (err.message || err), true);
      });
    }

    /* ===== Subscribe to developer registry ===== */
    function subscribeDevelopers() {
      const q = query(collection(db, 'developers'));
      onSnapshot(q, (snap) => {
        _developers = [];
        snap.forEach(d => {
          const x = d.data();
          if (x.active !== false) _developers.push({ slug: d.id, ...x });
        });
        _developers.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        if (_activeSection === 'developer') { renderSubcats(); renderFiles(); }
      }, (err) => console.warn('[database] developers onSnapshot', err));
    }

    /* ===== Upload ===== */
    const MAX_BYTES = 50 * 1024 * 1024;
    function safeFilename(name) {
      const stamp = Date.now().toString(36);
      const cleaned = (name || 'file').replace(/[^A-Za-z0-9._\-぀-ヿ一-鿿]/g, '_');
      return `${stamp}-${cleaned}`;
    }

    async function uploadOne(file) {
      const dict = I18N[currentLang];
      if (file.size > MAX_BYTES) { showToast(dict.toastTooBig, true); return; }

      const path = `database/${_activeSection}/${_activeSub || 'all'}/${safeFilename(file.name)}`;
      const ref = sref(storage, path);
      const meta = {
        contentType: file.type || 'application/octet-stream',
        customMetadata: { uploadedBy: _me.uid }
      };
      const task = uploadBytesResumable(ref, file, meta);
      const progressEl = document.getElementById('uploadProgress');
      const bar = progressEl.querySelector('.bar');
      progressEl.style.display = 'block';
      bar.style.width = '0%';

      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      const origLabel = btn.querySelector('span').textContent;
      btn.querySelector('span').textContent = dict.uploading;

      return new Promise((resolve) => {
        task.on('state_changed',
          (s) => { bar.style.width = ((s.bytesTransferred / s.totalBytes) * 100).toFixed(1) + '%'; },
          (err) => {
            console.error(err);
            showToast(dict.toastUploadFailed + (err.message || err.code || err), true);
            progressEl.style.display = 'none';
            btn.disabled = false;
            btn.querySelector('span').textContent = origLabel;
            resolve();
          },
          async () => {
            try {
              const url = await getDownloadURL(task.snapshot.ref);
              await addDoc(collection(db, 'databaseFiles'), {
                section: _activeSection,
                subcategory: _activeSub || 'all',
                name: file.name,
                storagePath: path,
                size: file.size,
                type: file.type || '',
                downloadUrl: url,
                uploadedBy: _me.uid,
                uploadedByName: _me.displayName || (_me.email || '').split('@')[0],
                uploadedByEmail: _me.email || '',
                createdAt: serverTimestamp()
              });
              showToast(dict.toastUploaded);
            } catch (err) {
              console.error(err);
              showToast(dict.toastUploadFailed + (err.message || err), true);
            } finally {
              setTimeout(() => { progressEl.style.display = 'none'; bar.style.width = '0%'; }, 800);
              btn.disabled = false;
              btn.querySelector('span').textContent = origLabel;
              resolve();
            }
          }
        );
      });
    }

    document.getElementById('uploadBtn').addEventListener('click', () =>
      document.getElementById('fileInput').click()
    );
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const files = [...(e.target.files || [])];
      e.target.value = '';
      for (const f of files) await uploadOne(f);
    });

    /* Drag-and-drop */
    const card = document.getElementById('uploadCard');
    ['dragenter', 'dragover'].forEach(ev =>
      card.addEventListener(ev, (e) => {
        e.preventDefault(); e.stopPropagation();
        card.classList.add('drag');
      })
    );
    ['dragleave', 'drop'].forEach(ev =>
      card.addEventListener(ev, (e) => {
        e.preventDefault(); e.stopPropagation();
        card.classList.remove('drag');
      })
    );
    card.addEventListener('drop', async (e) => {
      const files = [...(e.dataTransfer?.files || [])];
      for (const f of files) await uploadOne(f);
    });

    /* ===== Delete ===== */
    async function deleteFile(id) {
      const f = _files.find(x => x.id === id);
      if (!f) return;
      const dict = I18N[currentLang];
      if (!confirm(dict.confirmDelete)) return;
      try {
        if (f.storagePath) {
          try { await deleteObject(sref(storage, f.storagePath)); }
          catch (_) { /* missing storage object is OK — proceed with metadata delete */ }
        }
        await deleteDoc(doc(db, 'databaseFiles', id));
        showToast(dict.toastDeleted);
      } catch (err) {
        console.error(err);
        showToast(dict.toastDeleteFailed + (err.message || err), true);
      }
    }

    /* ===== Auth + init ===== */
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      _me = user;
      _isAdminUser = isAdmin(user.email);
      let firstName = (user.displayName || '').trim().split(/\s+/)[0];
      try {
        const snap = await getDoc(doc(db, 'agents', user.uid));
        if (snap.exists() && snap.data().firstName) firstName = snap.data().firstName;
      } catch (_) {}
      if (!firstName && user.email) {
        const local = user.email.split('@')[0].split(/[._-]/)[0];
        firstName = local.charAt(0).toUpperCase() + local.slice(1);
      }
      document.getElementById('userName').textContent = firstName || 'Agent';
      subscribeFiles();
      subscribeDevelopers();
    });

    setLang('ja');
  </script>
</body>
</html>

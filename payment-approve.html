<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Approval — Exceed Real Estate</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <!-- PWA: manifest, theme color, iOS install support. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a1f3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exceed">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script src="pwa-init.js" defer></script>
  <script src="theme-init.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="liquid.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --navy-0: #15171c; --navy-1: #1c1f26; --navy-2: #262a33; --navy-3: #2f3340;
      --line: rgba(255,255,255,0.06); --line-strong: rgba(255,255,255,0.12);
      --text: #f5f7fa; --muted: #8a91a3; --gold: #ffd84d; --cream: #f5f7fa;
      --green:#5cc98f; --red:#ff6b6b; --radius:14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--navy-0); }
    body {
      font-family: 'Noto Sans JP','Inter',sans-serif;
      background:
        var(--navy-0);
      color: var(--text); min-height: 100vh;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px); background: rgba(5,20,40,0.7);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; color: inherit; }
    .brand img { width: 40px; height: 40px; border-radius: 8px; }
    .brand-name { font-family: 'Inter', 'Noto Sans JP', sans-serif; letter-spacing: 2px; font-weight: 600; }
    .brand-name span { color: var(--gold); font-weight: 400; }
    .icon-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-family: inherit; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
      transition: background .2s; display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--line-strong); }
    .icon-btn svg { width: 14px; height: 14px; }

    main { max-width: 720px; margin: 0 auto; padding: 36px 32px 80px; }

    .card {
      background: linear-gradient(180deg, rgba(16,42,79,0.85), rgba(10,31,61,0.85));
      backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 28px;
    }

    .pill {
      display: inline-block; padding: 5px 14px; border-radius: 999px; font-size: 11px;
      font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid;
    }
    .pill.submitted { background: rgba(212,184,122,0.14); color: var(--gold); border-color: rgba(212,184,122,0.4); }
    .pill.approved  { background: rgba(92,201,143,0.14);  color: var(--green); border-color: rgba(92,201,143,0.4); }
    .pill.declined  { background: rgba(255,107,107,0.14); color: var(--red); border-color: rgba(255,107,107,0.4); }
    .pill.cancelled { background: rgba(255,255,255,0.05); color: var(--muted); border-color: var(--line-strong); }

    h1 { font-family: 'Playfair Display','Noto Serif JP',serif; font-weight: 600; font-size: clamp(24px, 4vw, 36px); margin: 14px 0 4px; }
    .amount {
      font-family: 'Playfair Display','Noto Serif JP',serif; font-weight: 700;
      color: var(--gold); font-size: 38px; margin: 14px 0 4px;
    }
    .req-info { color: var(--muted); font-size: 13px; margin: 4px 0 16px; }

    .meta-row {
      display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px;
      padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px;
    }
    .meta-row:last-child { border-bottom: 1px solid var(--line); }
    .meta-row .k { color: var(--muted); font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; padding-top: 2px; }
    .meta-row .v { color: var(--cream); }

    .actions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    .btn-approve, .btn-decline, .btn-pdf {
      flex: 1; min-width: 200px; padding: 14px 18px; border-radius: 10px; font-weight: 700;
      font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
      font-family: inherit; border: 1px solid;
    }
    .btn-approve { background: rgba(92,201,143,0.14); color: var(--green); border-color: rgba(92,201,143,0.5); }
    .btn-approve:hover { background: rgba(92,201,143,0.22); }
    .btn-decline { background: rgba(255,107,107,0.10); color: var(--red); border-color: rgba(255,107,107,0.5); }
    .btn-decline:hover { background: rgba(255,107,107,0.18); }
    .btn-pdf {
      flex: 0 0 auto; min-width: 140px; background: transparent; color: var(--gold);
      border-color: rgba(212,184,122,0.5);
    }
    .btn-pdf:hover { background: rgba(212,184,122,0.12); }

    .gate-msg {
      margin-top: 20px; padding: 14px; border-radius: 10px;
      background: rgba(212,184,122,0.06); border: 1px solid rgba(212,184,122,0.2);
      color: var(--cream); font-size: 13px; line-height: 1.6;
    }
    .gate-msg.deny { background: rgba(255,107,107,0.06); border-color: rgba(255,107,107,0.3); color: var(--red); }

    .approver-line { margin-top: 12px; color: var(--muted); font-size: 12px; }
    .approver-line strong { color: var(--cream); }

    /* ----- Attachment & signature blocks ----- */
    .attach-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .attach-link {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
      background: rgba(255,255,255,0.03); text-decoration: none; color: var(--cream);
      font-size: 13px;
    }
    .attach-link:hover { background: rgba(212,184,122,0.06); border-color: rgba(212,184,122,0.4); }
    .attach-link .ico { color: var(--gold); font-size: 16px; }
    .attach-link .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-link .ext { color: var(--muted); font-size: 11px; }

    .sig-block {
      margin-top: 22px; padding: 18px; border-radius: 12px;
      background: rgba(212,184,122,0.04); border: 1px solid rgba(212,184,122,0.25);
    }
    .sig-block .sig-h {
      font-family: 'Playfair Display','Noto Serif JP',serif; font-size: 16px;
      font-weight: 600; color: var(--cream); margin: 0 0 6px;
    }
    .sig-block .sig-sub { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin: 0 0 14px; }
    .sig-block .step-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;
    }
    @media (max-width: 540px) { .sig-block .step-row { grid-template-columns: 1fr; } }
    .sig-block .step {
      padding: 12px; background: rgba(0,0,0,0.18); border: 1px solid var(--line);
      border-radius: 8px; font-size: 12.5px;
    }
    .sig-block .step strong { color: var(--cream); }
    .sig-block .step.done { border-color: rgba(92,201,143,0.4); }
    .sig-block .upload-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 14px; background: rgba(255,255,255,0.03); border: 1px dashed var(--line-strong);
      border-radius: 10px; margin-top: 12px; cursor: pointer;
    }
    .sig-block .upload-row:hover { border-color: var(--gold); background: rgba(212,184,122,0.05); }
    .sig-block .upload-row input[type="file"] { display: none; }
    .sig-block .uploaded {
      display: flex; align-items: center; gap: 10px; margin-top: 10px;
      padding: 10px 12px; background: rgba(92,201,143,0.08); border: 1px solid rgba(92,201,143,0.3);
      border-radius: 10px; font-size: 12.5px; color: var(--cream);
    }
    .sig-block .uploaded .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .wa-cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px 22px; border-radius: 10px;
      background: #25d366; color: #fff; font-family: inherit; font-weight: 700;
      font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
      text-decoration: none; border: 0; margin-top: 14px;
    }
    .wa-cta:hover { background: #1ec159; }
    .wa-cta svg { width: 14px; height: 14px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(10,31,61,0.95); border: 1px solid var(--gold); color: var(--cream);
      padding: 12px 22px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
    .toast.error { border-color: var(--red); color: var(--red); }
    /* ============================================================
       v2 — Wise-style sidebar shell (matches agent.html)
       ============================================================ */
    .v2-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .v2-side {
      position: sticky; top: 0;
      height: 100vh; width: 240px;
      background: var(--navy-1);
      border-right: 1px solid var(--navy-3);
      display: flex; flex-direction: column;
      padding: 20px 14px 14px;
      z-index: 30;
    }
    .v2-brand {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; padding: 4px 6px 18px;
      border-bottom: 1px solid var(--navy-3);
    }
    .v2-brand-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--gold); color: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; letter-spacing: .5px;
      font-family: 'Inter', sans-serif;
    }
    .v2-brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .v2-brand-text strong { color: var(--cream); font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; }
    .v2-brand-text span { color: var(--muted); font-size: 10.5px; letter-spacing: .5px; }
    .v2-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; flex: 1; }
    .v2-nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 8px;
      color: var(--muted);
      font-size: 13.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      transition: background .15s, color .15s;
      position: relative;
    }
    .v2-nav-item:hover { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item svg { width: 18px; height: 18px; flex: none; }
    .v2-nav-item.active { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item.active::before {
      content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px;
      width: 3px; background: var(--gold); border-radius: 0 3px 3px 0;
    }
    .v2-foot { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--navy-3); }
    .v2-foot-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border-radius: 8px;
      background: transparent; border: 0;
      color: var(--muted); font-size: 12.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-align: left; cursor: pointer;
      transition: background .15s, color .15s;
      text-decoration: none;
    }
    .v2-foot-btn:hover { background: var(--navy-2); color: var(--cream); }
    .v2-foot-btn svg { width: 16px; height: 16px; flex: none; }
    .v2-main { display: flex; flex-direction: column; min-width: 0; padding: 0 0 40px; }
    .v2-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 18px 32px;
      border-bottom: 1px solid var(--navy-3);
      background: var(--navy-0);
    }
    .v2-top-user { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .v2-top-user strong { color: var(--cream); font-weight: 600; }
    .v2-top-actions { display: flex; align-items: center; gap: 10px; }
    .v2-main .page-head { padding-top: 32px; }
    .v2-main .page-head .eyebrow { color: var(--muted); letter-spacing: 1.8px; }
    @media (max-width: 1180px) {
      .v2-shell { grid-template-columns: 64px 1fr; }
      .v2-side { width: 64px; padding: 16px 8px; }
      .v2-brand-text, .v2-nav-item span, .v2-foot-btn span { display: none; }
      .v2-nav-item, .v2-foot-btn { justify-content: center; padding: 10px; }
      .v2-brand { justify-content: center; }
    }
    @media (max-width: 820px) {
      .v2-shell { grid-template-columns: 1fr; }
      .v2-side {
        position: relative; height: auto; width: 100%;
        flex-direction: row; align-items: center;
        padding: 12px 16px; border-right: 0;
        border-bottom: 1px solid var(--navy-3);
      }
      .v2-nav { flex-direction: row; margin-top: 0; gap: 4px; overflow-x: auto; }
      .v2-nav-item.active::before { display: none; }
      .v2-nav-item.active { box-shadow: inset 0 -2px 0 var(--gold); }
      .v2-foot { flex-direction: row; padding-top: 0; border-top: 0; }
      .v2-top { padding: 14px 18px; }
    }

  </style>
</head>
<body>
  <div class="v2-shell">

    <!-- ===== Sidebar ===== -->
    <aside class="v2-side">
      <div class="v2-brand" onclick="window.location.href='agent.html'" title="Exceed Real Estate">
        <div class="v2-brand-mark">EX</div>
        <div class="v2-brand-text">
          <strong>Exceed</strong>
          <span>REAL ESTATE</span>
        </div>
      </div>
      <nav class="v2-nav">
        <a class="v2-nav-item" href="agent.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>

          <span>カレンダー</span>
        </a>
        <a class="v2-nav-item" href="team.html">

          <span>チーム</span>
        </a>
        <a class="v2-nav-item" href="travel.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>

          <span>データベース</span>
        </a>
      </nav>
      <div class="v2-foot">
        <a class="v2-foot-btn" href="agent.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span data-i18n="back">ダッシュボード</span>
        </a>
      </div>
    </aside>

    <!-- ===== Main pane ===== -->
    <div class="v2-main">

      <header class="v2-top">
        <div class="v2-top-user">
          <span data-i18n="hello">こんにちは、</span><strong id="userName">—</strong>
        </div>
        <div class="v2-top-actions">
          <div class="lang-toggle" id="langToggle">
            <span class="pill" id="langPill"></span>
            <button data-lang="ja" class="active">日本語</button>
            <button data-lang="en">EN</button>
          </div>

      </header>
  <main>
    <div class="card" id="paneCard">
      <div id="paneContent" style="text-align:center;color:var(--muted);padding:40px 0;">Loading…</div>
    </div>

  <div class="toast" id="toast"></div>
    </div><!-- /v2-main -->
  </div><!-- /v2-shell -->

  <script type="module">
    import { auth, db, storage, isAdmin } from './firebase-init.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { doc, getDoc, updateDoc, serverTimestamp } from
      "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
    import { ref as sRef, uploadBytes, getDownloadURL }
      from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";
    import {
      sendPaymentNotifications, canApprovePayment, FINANCE, SMALL_AMOUNT_AED,
      whatsappApprovalUrl, nextStatusAfterApproval, nextApprover
    } from './payment-notify.js';
    import { buildPaymentPdfBase64, downloadPaymentPdf } from './payment-pdf.js';

    function escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function fmtAmount(v) {
      const n = Number(v || 0);
      return n.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' AED';
    }
    function fmtDate(d) {
      if (!d) return '—';
      try {
        return new Date(d).toLocaleDateString('en-GB',
          { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      } catch (_) { return d; }
    }
    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.toggle('error', !!isErr);
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    /* PDF rendering lives in payment-pdf.js — shared with payment.html. */
    async function downloadPdf(p, id) {
      try {
        await downloadPaymentPdf(p, id);
      } catch (err) {
        console.error(err);
        showToast('PDF failed: ' + (err.message || err), true);
      }
    }

    let me = null, myProfile = null, myRole = null;
    let payment = null, paymentId = null;

    /* Map status to a status label + the "what happens next" line. */
    function statusLabel(status) {
      if (status === 'submitted')       return 'Pending — Mouad review';
      if (status === 'mouad-approved')  return 'Pending — CEO co-sign';
      if (status === 'approved')        return 'Approved';
      if (status === 'declined')        return 'Declined';
      if (status === 'cancelled')       return 'Cancelled';
      return status || 'submitted';
    }
    function nextLine(p) {
      const amt = p.amount || 0;
      if (amt > SMALL_AMOUNT_AED) {
        return 'Tier: <strong>> 1,000 AED</strong> · approvers: <strong>Mouad → Teruo</strong> (CEO co-sign).';
      }
      return 'Tier: <strong>≤ 1,000 AED</strong> · approver: <strong>Mouad</strong> (final). Hira on cc.';
    }

    /* Render an invoice/receipt link list. */
    function invoiceListHtml(p) {
      const items = (p.invoiceUrls && Array.isArray(p.invoiceUrls)) ? p.invoiceUrls : [];
      if (!items.length) return '';
      const rows = items.map(a => {
        const ext = (a.name || '').split('.').pop().toUpperCase();
        return `<a class="attach-link" href="${escHtml(a.url)}" target="_blank" rel="noopener">
          <span class="ico">📄</span>
          <span class="name">${escHtml(a.name || 'file')}</span>
          <span class="ext">${escHtml(ext)}</span>
        </a>`;
      }).join('');
      return `<div style="margin-top:18px;">
        <div class="meta-row" style="border-bottom:0;"><div class="k">Invoice / Receipt</div>
        <div class="v"><div class="attach-list">${rows}</div></div></div>
      </div>`;
    }

    function bankBlockHtml(p) {
      const b = p.bankAccount;
      if (!b || (!b.bankName && !b.accountHolderName)) return '';
      const lines = [
        b.label ? `<strong>${escHtml(b.label)}</strong>` : '',
        `${escHtml(b.bankName || '')}${b.accountHolderName ? ' — ' + escHtml(b.accountHolderName) : ''}`,
        b.accountNumber ? `Account: ${escHtml(b.accountNumber)}` : '',
        b.iban ? `IBAN: ${escHtml(b.iban)}` : '',
        b.swift ? `SWIFT: ${escHtml(b.swift)}` : ''
      ].filter(Boolean).join('<br>');
      return `<div class="meta-row"><div class="k">Receiving bank</div><div class="v">${lines}</div></div>`;
    }

    /* Signature block — download unsigned / Mouad-signed, upload signed PDF,
       then click Approve. Shown only while user is the active approver. */
    function sigBlockHtml(p, whoIsActing) {
      const isCeoStep = whoIsActing === 'teruo';
      const stepMouad = p.signedPdfUrl
        ? '<div class="step done"><strong>1.</strong> Mouad signed ✓</div>'
        : '<div class="step"><strong>1.</strong> Mouad downloads, signs, uploads.</div>';
      const stepCeo = isCeoStep
        ? '<div class="step"><strong>2.</strong> CEO downloads Mouad-signed PDF, co-signs, uploads.</div>'
        : ((p.amount || 0) > SMALL_AMOUNT_AED
            ? '<div class="step"><strong>2.</strong> Then Teruo co-signs (> 1,000 AED).</div>'
            : '');
      const uploadedHtml = p.pendingSignedName
        ? `<div class="uploaded"><span class="ico">📄</span><span class="name">${escHtml(p.pendingSignedName)}</span><span style="color:var(--green);font-weight:700;">Ready to approve</span></div>`
        : '';
      return `<div class="sig-block">
        <div class="sig-h">Sign &amp; approve</div>
        <div class="sig-sub">Download the PDF, sign it with whatever tool you prefer (Preview / Apple Markup / Adobe / iLovePDF / etc.), then upload the signed version. Optional — you can also approve without uploading and the request will still go through unsigned.</div>
        <div class="step-row">${stepMouad}${stepCeo}</div>
        <button class="btn-pdf" id="btnDownloadForSign" style="width:100%;margin-top:14px;">⬇ Download ${p.signedPdfUrl ? 'Mouad-signed' : 'unsigned'} PDF to sign</button>
        <label class="upload-row" for="signedPdfInput">
          <span style="color:var(--gold);font-size:18px;">📤</span>
          <span style="color:var(--cream);font-size:13px;font-weight:600;">Upload signed PDF</span>
          <span style="color:var(--muted);font-size:11px;">PDF · up to 20 MB</span>
          <input type="file" id="signedPdfInput" accept="application/pdf">
        </label>
        ${uploadedHtml}
      </div>`;
    }

    function render() {
      const status = payment.status || 'submitted';
      const isActiveApprover = (status === 'submitted' || status === 'mouad-approved')
                               && canApprovePayment(payment, myRole, (me.email || '').toLowerCase());
      const whoIsActing = nextApprover(payment);

      const dec = [];
      if (payment.mouadDecisionBy) dec.push(`Mouad: <strong>${escHtml(payment.mouadDecisionBy)}</strong>${payment.mouadDecisionAt ? ' on ' + new Date(payment.mouadDecisionAt).toLocaleString('en-GB') : ''}`);
      if (payment.ceoDecisionBy)   dec.push(`CEO: <strong>${escHtml(payment.ceoDecisionBy)}</strong>${payment.ceoDecisionAt ? ' on ' + new Date(payment.ceoDecisionAt).toLocaleString('en-GB') : ''}`);
      const decisionLine = (dec.length
        ? `<div class="approver-line">${dec.join(' &nbsp;·&nbsp; ')}</div>`
        : `<div class="approver-line">${nextLine(payment)}</div>`);

      let actionBlock = '';
      if (isActiveApprover) {
        actionBlock = sigBlockHtml(payment, whoIsActing)
          + `<div class="actions">
              <button class="btn-approve" id="btnApprove">✓ Approve</button>
              <button class="btn-decline" id="btnDecline">✕ Decline</button>
            </div>
            <div class="gate-msg">You are the active approver. ${nextLine(payment)}</div>`;
      } else if (status === 'mouad-approved' && (me.email || '').toLowerCase() === FINANCE.mouad) {
        // Mouad already signed off — show "Send to Teruo on WhatsApp"
        actionBlock = `<div class="gate-msg">Awaiting CEO co-sign. Send the link to Teruo on WhatsApp:</div>
          <a class="wa-cta" id="btnSendTeruo" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-1 1.1-.2.2-.4.2-.6.1-.7-.4-1.5-.7-2.4-1.6-.7-.6-1.1-1.4-1.3-1.6-.1-.2 0-.3.1-.4.1-.1.2-.3.4-.4.1-.1.2-.2.2-.4.1-.2 0-.3 0-.4 0-.1-.6-1.5-.9-2-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4 0 1.4 1 2.8 1.2 3 .1.2 2 3.1 4.9 4.4.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3M12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.7 1.5 5.3L2 22l4.8-1.3c1.5.8 3.3 1.3 5.2 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
            Send to Teruo on WhatsApp
          </a>
          <div class="actions" style="margin-top:14px;">
            <button class="btn-pdf" id="btnPdf">📄 Download current PDF</button>
          </div>`;
      } else {
        actionBlock = `<div class="actions">
            <button class="btn-pdf" id="btnPdf">📄 Download PDF</button>
          </div>`;
        if (status === 'submitted' || status === 'mouad-approved') {
          actionBlock += `<div class="gate-msg deny">You're not the active approver right now.</div>`;
        }
      }

      const headerHtml = `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <span class="pill ${escHtml(status)}">${escHtml(statusLabel(status))}</span>
          <span style="color:var(--muted);font-size:12px;">Ref: ${escHtml(paymentId.slice(0, 8))}…</span>
        </div>
        <h1>Payment Request</h1>
        <div class="req-info">${escHtml(payment.purpose || '')}${payment.recipient ? ' · ' + escHtml(payment.recipient) : ''}</div>
        <div class="amount">${escHtml(fmtAmount(payment.amount))}</div>
        ${decisionLine}

        <div style="margin-top:18px;">
          <div class="meta-row"><div class="k">Requester</div><div class="v">${escHtml(payment.requesterName || '—')}<br><span style="color:var(--muted);font-size:12px;">${escHtml(payment.requesterEmail || '')}</span></div></div>
          <div class="meta-row"><div class="k">Pay to</div><div class="v">${escHtml(payment.recipient || '—')}</div></div>
          ${bankBlockHtml(payment)}
          <div class="meta-row"><div class="k">Category</div><div class="v">${escHtml(payment.category || '—')}</div></div>
          <div class="meta-row"><div class="k">Due date</div><div class="v">${escHtml(fmtDate(payment.dueDate))}</div></div>
          <div class="meta-row"><div class="k">Notes</div><div class="v">${escHtml(payment.notes || '—')}</div></div>
        </div>

        ${invoiceListHtml(payment)}
        ${actionBlock}`;

      const pane = document.getElementById('paneContent');
      pane.replaceChildren();
      pane.insertAdjacentHTML('beforeend', headerHtml);

      const pdfBtn = document.getElementById('btnPdf');
      if (pdfBtn) pdfBtn.addEventListener('click', () => downloadPdf(payment, paymentId));

      const dlSign = document.getElementById('btnDownloadForSign');
      if (dlSign) dlSign.addEventListener('click', () => downloadForSigning());

      const sigInput = document.getElementById('signedPdfInput');
      if (sigInput) sigInput.addEventListener('change', handleSignedUpload);

      const approveBtn = document.getElementById('btnApprove');
      if (approveBtn) approveBtn.addEventListener('click', () => decide('approved'));
      const declineBtn = document.getElementById('btnDecline');
      if (declineBtn) declineBtn.addEventListener('click', () => decide('declined'));

      const teruoBtn = document.getElementById('btnSendTeruo');
      if (teruoBtn) teruoBtn.href = whatsappApprovalUrl('teruo', payment, paymentId);
    }

    /* Download the current PDF — Mouad-signed version if available, else fresh. */
    async function downloadForSigning() {
      if (payment.signedPdfUrl) {
        // Open the latest signed version in a new tab so the approver can save+sign it.
        window.open(payment.signedPdfUrl, '_blank');
      } else {
        await downloadPdf(payment, paymentId);
      }
    }

    /* Buffer for the signed PDF the approver uploads before clicking Approve. */
    let pendingSignedFile = null;
    async function handleSignedUpload(e) {
      const f = e.target.files[0];
      if (!f) return;
      if (f.type !== 'application/pdf') {
        showToast('PDF only.', true); return;
      }
      if (f.size > 20 * 1024 * 1024) {
        showToast('PDF too large (>20MB).', true); return;
      }
      pendingSignedFile = f;
      payment.pendingSignedName = f.name; // for the rendered "ready to approve" badge
      render();
    }

    async function decide(action) {
      const verb = action === 'approved' ? 'approve' : 'decline';
      if (!confirm(`Confirm ${verb} this payment request?`)) return;
      const actorName = (myProfile && (myProfile.firstName || myProfile.lastName))
        ? `${myProfile.firstName || ''} ${myProfile.lastName || ''}`.trim()
        : (me.displayName || me.email);
      const myEmail = (me.email || '').toLowerCase();
      try {
        // 1. If a signed PDF is queued, upload it first so the next viewer
        //    sees the signed version on the same paymentId.
        let signedUrl = payment.signedPdfUrl || null;
        if (pendingSignedFile) {
          const tag = myEmail === FINANCE.ceo ? 'ceo' : 'mouad';
          const path = `payments/${paymentId}/signed-${tag}-${Date.now()}.pdf`;
          const r = sRef(storage, path);
          await uploadBytes(r, pendingSignedFile, {
            contentType: 'application/pdf',
            customMetadata: { signedBy: me.uid, signerEmail: myEmail }
          });
          signedUrl = await getDownloadURL(r);
        }

        // 2. Compute the next status using the sequential rules.
        const newStatus = action === 'declined'
          ? 'declined'
          : nextStatusAfterApproval(payment, myEmail);

        // 3. Build the doc patch — track each signer separately so the
        //    PDF can show both signature lines on > 1,000 AED requests.
        const nowIso = new Date().toISOString();
        const patch = { status: newStatus };
        if (signedUrl) patch.signedPdfUrl = signedUrl;
        if (action === 'approved' && myEmail === FINANCE.mouad) {
          patch.mouadDecisionAt = nowIso;
          patch.mouadDecisionBy = actorName;
          patch.mouadDecisionUid = me.uid;
        }
        if (action === 'approved' && myEmail === FINANCE.ceo) {
          patch.ceoDecisionAt = nowIso;
          patch.ceoDecisionBy = actorName;
          patch.ceoDecisionUid = me.uid;
        }
        // Final-decision mirror (kept for backward compat with old reports).
        if (newStatus === 'approved' || newStatus === 'declined') {
          patch.decisionAt = nowIso;
          patch.decisionBy = actorName;
          patch.decisionUid = me.uid;
        }

        await updateDoc(doc(db, 'payments', paymentId), patch);

        // 4. Re-fetch fresh state for notifications + re-render.
        const fresh = await getDoc(doc(db, 'payments', paymentId));
        payment = fresh.data();
        pendingSignedFile = null;
        delete payment.pendingSignedName;

        const pdfBase64 = await buildPaymentPdfBase64(payment, paymentId);
        await sendPaymentNotifications(db, {
          payment, paymentId, status: newStatus,
          actorName, actorUid: me.uid,
          pdfBase64, pdfFilename: `Payment-Request-${paymentId}.pdf`
        });

        const msg = newStatus === 'approved' ? 'Approved.'
                  : newStatus === 'mouad-approved' ? 'Signed. Forward to Teruo to complete.'
                  : 'Declined.';
        showToast(msg);
        render();
      } catch (err) {
        console.error(err);
        showToast('Could not save: ' + (err.message || ''), true);
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      me = user;
      try {
        const snap = await getDoc(doc(db, 'agents', user.uid));
        if (snap.exists()) { myProfile = snap.data(); myRole = myProfile.role || null; }
      } catch (_) {}
      const params = new URLSearchParams(location.search);
      paymentId = params.get('id');
      if (!paymentId) {
        document.getElementById('paneContent').innerHTML = `<div style="text-align:center;color:var(--muted);padding:30px 0;">Missing payment id.</div>`;
        return;
      }
      try {
        const snap = await getDoc(doc(db, 'payments', paymentId));
        if (!snap.exists()) {
          document.getElementById('paneContent').innerHTML = `<div style="text-align:center;color:var(--muted);padding:30px 0;">Payment request not found.</div>`;
          return;
        }
        payment = snap.data();
        render();
      } catch (err) {
        console.error(err);
        document.getElementById('paneContent').innerHTML = `<div style="text-align:center;color:var(--red);padding:30px 0;">Error: ${err.message || ''}</div>`;
      }
    });
  </script>
</body>
</html>

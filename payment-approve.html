<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Approval — Exceed Real Estate</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <!-- PWA: manifest, theme color, iOS install support. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a1f3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exceed">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script src="pwa-init.js" defer></script>
  <script src="theme-init.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="liquid.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --navy-0: #15171c; --navy-1: #1c1f26; --navy-2: #262a33; --navy-3: #2f3340;
      --line: rgba(255,255,255,0.06); --line-strong: rgba(255,255,255,0.12);
      --text: #f5f7fa; --muted: #8a91a3; --gold: #ffd84d; --cream: #f5f7fa;
      --green:#5cc98f; --red:#ff6b6b; --radius:14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--navy-0); }
    body {
      font-family: 'Noto Sans JP','Inter',sans-serif;
      background:
        var(--navy-0);
      color: var(--text); min-height: 100vh;
    }
    .topbar { display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px); background: rgba(5,20,40,0.7);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; color: inherit; }
    .brand img { width: 40px; height: 40px; border-radius: 8px; }
    .brand-name { font-family: 'Inter', 'Noto Sans JP', sans-serif; letter-spacing: 2px; font-weight: 600; }
    .brand-name span { color: var(--gold); font-weight: 400; }
    .icon-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-family: inherit; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
      transition: background .2s; display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--line-strong); }
    .icon-btn svg { width: 14px; height: 14px; }

    main { max-width: 720px; margin: 0 auto; padding: 36px 32px 80px; }

    .card {
      background: linear-gradient(180deg, rgba(16,42,79,0.85), rgba(10,31,61,0.85));
      backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 28px;
    }

    .pill {
      display: inline-block; padding: 5px 14px; border-radius: 999px; font-size: 11px;
      font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; border: 1px solid;
    }
    .pill.submitted { background: rgba(212,184,122,0.14); color: var(--gold); border-color: rgba(212,184,122,0.4); }
    .pill.approved  { background: rgba(92,201,143,0.14);  color: var(--green); border-color: rgba(92,201,143,0.4); }
    .pill.declined  { background: rgba(255,107,107,0.14); color: var(--red); border-color: rgba(255,107,107,0.4); }
    .pill.cancelled { background: rgba(255,255,255,0.05); color: var(--muted); border-color: var(--line-strong); }

    h1 { font-family: 'Playfair Display','Noto Serif JP',serif; font-weight: 600; font-size: clamp(24px, 4vw, 36px); margin: 14px 0 4px; }
    .amount {
      font-family: 'Playfair Display','Noto Serif JP',serif; font-weight: 700;
      color: var(--gold); font-size: 38px; margin: 14px 0 4px;
    }
    .req-info { color: var(--muted); font-size: 13px; margin: 4px 0 16px; }

    .meta-row {
      display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px;
      padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px;
    }
    .meta-row:last-child { border-bottom: 1px solid var(--line); }
    .meta-row .k { color: var(--muted); font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; padding-top: 2px; }
    .meta-row .v { color: var(--cream); }

    .actions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    .btn-approve, .btn-decline, .btn-pdf {
      flex: 1; min-width: 200px; padding: 14px 18px; border-radius: 10px; font-weight: 700;
      font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
      font-family: inherit; border: 1px solid;
    }
    .btn-approve { background: rgba(92,201,143,0.14); color: var(--green); border-color: rgba(92,201,143,0.5); }
    .btn-approve:hover { background: rgba(92,201,143,0.22); }
    .btn-decline { background: rgba(255,107,107,0.10); color: var(--red); border-color: rgba(255,107,107,0.5); }
    .btn-decline:hover { background: rgba(255,107,107,0.18); }
    .btn-pdf {
      flex: 0 0 auto; min-width: 140px; background: transparent; color: var(--gold);
      border-color: rgba(212,184,122,0.5);
    }
    .btn-pdf:hover { background: rgba(212,184,122,0.12); }

    .gate-msg {
      margin-top: 20px; padding: 14px; border-radius: 10px;
      background: rgba(212,184,122,0.06); border: 1px solid rgba(212,184,122,0.2);
      color: var(--cream); font-size: 13px; line-height: 1.6;
    }
    .gate-msg.deny { background: rgba(255,107,107,0.06); border-color: rgba(255,107,107,0.3); color: var(--red); }

    .approver-line { margin-top: 12px; color: var(--muted); font-size: 12px; }
    .approver-line strong { color: var(--cream); }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(10,31,61,0.95); border: 1px solid var(--gold); color: var(--cream);
      padding: 12px 22px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity .25s, transform .25s; z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
    .toast.error { border-color: var(--red); color: var(--red); }
    /* ============================================================
       v2 — Wise-style sidebar shell (matches agent.html)
       ============================================================ */
    .v2-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .v2-side {
      position: sticky; top: 0;
      height: 100vh; width: 240px;
      background: var(--navy-1);
      border-right: 1px solid var(--navy-3);
      display: flex; flex-direction: column;
      padding: 20px 14px 14px;
      z-index: 30;
    }
    .v2-brand {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; padding: 4px 6px 18px;
      border-bottom: 1px solid var(--navy-3);
    }
    .v2-brand-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--gold); color: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; letter-spacing: .5px;
      font-family: 'Inter', sans-serif;
    }
    .v2-brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .v2-brand-text strong { color: var(--cream); font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; }
    .v2-brand-text span { color: var(--muted); font-size: 10.5px; letter-spacing: .5px; }
    .v2-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; flex: 1; }
    .v2-nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 8px;
      color: var(--muted);
      font-size: 13.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      transition: background .15s, color .15s;
      position: relative;
    }
    .v2-nav-item:hover { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item svg { width: 18px; height: 18px; flex: none; }
    .v2-nav-item.active { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item.active::before {
      content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px;
      width: 3px; background: var(--gold); border-radius: 0 3px 3px 0;
    }
    .v2-foot { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--navy-3); }
    .v2-foot-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border-radius: 8px;
      background: transparent; border: 0;
      color: var(--muted); font-size: 12.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-align: left; cursor: pointer;
      transition: background .15s, color .15s;
      text-decoration: none;
    }
    .v2-foot-btn:hover { background: var(--navy-2); color: var(--cream); }
    .v2-foot-btn svg { width: 16px; height: 16px; flex: none; }
    .v2-main { display: flex; flex-direction: column; min-width: 0; padding: 0 0 40px; }
    .v2-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 18px 32px;
      border-bottom: 1px solid var(--navy-3);
      background: var(--navy-0);
    }
    .v2-top-user { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .v2-top-user strong { color: var(--cream); font-weight: 600; }
    .v2-top-actions { display: flex; align-items: center; gap: 10px; }
    .v2-main .page-head { padding-top: 32px; }
    .v2-main .page-head .eyebrow { color: var(--muted); letter-spacing: 1.8px; }
    @media (max-width: 1180px) {
      .v2-shell { grid-template-columns: 64px 1fr; }
      .v2-side { width: 64px; padding: 16px 8px; }
      .v2-brand-text, .v2-nav-item span, .v2-foot-btn span { display: none; }
      .v2-nav-item, .v2-foot-btn { justify-content: center; padding: 10px; }
      .v2-brand { justify-content: center; }
    }
    @media (max-width: 820px) {
      .v2-shell { grid-template-columns: 1fr; }
      .v2-side {
        position: relative; height: auto; width: 100%;
        flex-direction: row; align-items: center;
        padding: 12px 16px; border-right: 0;
        border-bottom: 1px solid var(--navy-3);
      }
      .v2-nav { flex-direction: row; margin-top: 0; gap: 4px; overflow-x: auto; }
      .v2-nav-item.active::before { display: none; }
      .v2-nav-item.active { box-shadow: inset 0 -2px 0 var(--gold); }
      .v2-foot { flex-direction: row; padding-top: 0; border-top: 0; }
      .v2-top { padding: 14px 18px; }
    }

  </style>
</head>
<body>
  <div class="v2-shell">

    <!-- ===== Sidebar ===== -->
    <aside class="v2-side">
      <div class="v2-brand" onclick="window.location.href='agent.html'" title="Exceed Real Estate">
        <div class="v2-brand-mark">EX</div>
        <div class="v2-brand-text">
          <strong>Exceed</strong>
          <span>REAL ESTATE</span>
        </div>
      </div>
      <nav class="v2-nav">
        <a class="v2-nav-item" href="agent.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>ダッシュボード</span>
        </a>
        <a class="v2-nav-item" href="availability.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>カレンダー</span>
        </a>
        <a class="v2-nav-item" href="team.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>チーム</span>
        </a>
        <a class="v2-nav-item" href="travel.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
          <span>出張</span>
        </a>
        <a class="v2-nav-item" href="database.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          <span>データベース</span>
        </a>
      </nav>
      <div class="v2-foot">
        <a class="v2-foot-btn" href="agent.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span data-i18n="back">ダッシュボード</span>
        </a>
      </div>
    </aside>

    <!-- ===== Main pane ===== -->
    <div class="v2-main">

      <header class="v2-top">
        <div class="v2-top-user">
          <span data-i18n="hello">こんにちは、</span><strong id="userName">—</strong>
        </div>
        <div class="v2-top-actions">
          <div class="lang-toggle" id="langToggle">
            <span class="pill" id="langPill"></span>
            <button data-lang="ja" class="active">日本語</button>
            <button data-lang="en">EN</button>
          </div>
        </div>
      </header>
  <main>
    <div class="card" id="paneCard">
      <div id="paneContent" style="text-align:center;color:var(--muted);padding:40px 0;">Loading…</div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
    </div><!-- /v2-main -->
  </div><!-- /v2-shell -->

  <script type="module">
    import { auth, db, isAdmin } from './firebase-init.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { doc, getDoc, updateDoc, serverTimestamp } from
      "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
    import { sendPaymentNotifications, canApprovePayment, FINANCE, SMALL_AMOUNT_AED }
      from './payment-notify.js';
    import { buildPaymentPdfBase64, downloadPaymentPdf } from './payment-pdf.js';

    function fmtAmount(v) {
      const n = Number(v || 0);
      return n.toLocaleString('en-US', { maximumFractionDigits: 2 }) + ' AED';
    }
    function fmtDate(d) {
      if (!d) return '—';
      try {
        return new Date(d).toLocaleDateString('en-GB',
          { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      } catch (_) { return d; }
    }
    function showToast(msg, isErr) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.toggle('error', !!isErr);
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    /* PDF rendering lives in payment-pdf.js — shared with payment.html. */
    async function downloadPdf(p, id) {
      try {
        await downloadPaymentPdf(p, id);
      } catch (err) {
        console.error(err);
        showToast('PDF failed: ' + (err.message || err), true);
      }
    }

    let me = null, myProfile = null, myRole = null;
    let payment = null, paymentId = null;

    function render() {
      const status = payment.status || 'submitted';
      const isPending = status === 'submitted';
      const myEmail = (me.email || '').toLowerCase();
      const allowedToAct = isPending && canApprovePayment(payment, myRole, myEmail);

      const tierLine = (payment.amount || 0) > SMALL_AMOUNT_AED
        ? `Approver: <strong>CEO only</strong> (> 1,000 AED tier)`
        : `Approvers: <strong>Mouad / Hira</strong> · CEO cc · ≤ 1,000 AED tier`;

      const decisionLine = (status === 'approved' || status === 'declined') && payment.decisionBy
        ? `<div class="approver-line">Decided by <strong>${payment.decisionBy}</strong>${payment.decisionAt ? ' on ' + new Date(payment.decisionAt).toLocaleString('en-GB') : ''}.</div>`
        : `<div class="approver-line">${tierLine}</div>`;

      let buttons = '';
      if (allowedToAct) {
        buttons = `
          <div class="actions">
            <button class="btn-approve" id="btnApprove">✓ Approve</button>
            <button class="btn-decline" id="btnDecline">✕ Decline</button>
            <button class="btn-pdf" id="btnPdf">📄 PDF</button>
          </div>
          <div class="gate-msg">You can act on this request. Approval will email the requester, Mouad, Hira and the CEO.</div>`;
      } else if (isPending) {
        buttons = `
          <div class="actions">
            <button class="btn-pdf" id="btnPdf">📄 Download PDF</button>
          </div>
          <div class="gate-msg deny">You don't have approval rights for this tier. ${tierLine}</div>`;
      } else {
        buttons = `
          <div class="actions">
            <button class="btn-pdf" id="btnPdf">📄 Download PDF</button>
          </div>`;
      }

      document.getElementById('paneContent').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <span class="pill ${status}">${status}</span>
          <span style="color:var(--muted);font-size:12px;">Ref: ${paymentId.slice(0, 8)}…</span>
        </div>
        <h1>Payment Request</h1>
        <div class="req-info">${payment.purpose || ''}${payment.recipient ? ' · ' + payment.recipient : ''}</div>
        <div class="amount">${fmtAmount(payment.amount)}</div>
        ${decisionLine}

        <div style="margin-top:18px;">
          <div class="meta-row"><div class="k">Requester</div><div class="v">${payment.requesterName || '—'}<br><span style="color:var(--muted);font-size:12px;">${payment.requesterEmail || ''}</span></div></div>
          <div class="meta-row"><div class="k">Pay to</div><div class="v">${payment.recipient || '—'}</div></div>
          <div class="meta-row"><div class="k">Category</div><div class="v">${payment.category || '—'}</div></div>
          <div class="meta-row"><div class="k">Due date</div><div class="v">${fmtDate(payment.dueDate)}</div></div>
          <div class="meta-row"><div class="k">Notes</div><div class="v">${(payment.notes || '—').replace(/</g,'&lt;')}</div></div>
        </div>

        ${buttons}
      `;

      const pdfBtn = document.getElementById('btnPdf');
      if (pdfBtn) pdfBtn.addEventListener('click', () => downloadPdf(payment, paymentId));

      const approveBtn = document.getElementById('btnApprove');
      if (approveBtn) approveBtn.addEventListener('click', () => decide('approved'));
      const declineBtn = document.getElementById('btnDecline');
      if (declineBtn) declineBtn.addEventListener('click', () => decide('declined'));
    }

    async function decide(newStatus) {
      const verb = newStatus === 'approved' ? 'approve' : 'decline';
      if (!confirm(`Confirm ${verb} this payment request?`)) return;
      const actorName = (myProfile && (myProfile.firstName || myProfile.lastName))
        ? `${myProfile.firstName || ''} ${myProfile.lastName || ''}`.trim()
        : (me.displayName || me.email);
      try {
        await updateDoc(doc(db, 'payments', paymentId), {
          status: newStatus,
          decisionAt: new Date().toISOString(),
          decisionBy: actorName,
          decisionUid: me.uid
        });
        // Re-fetch fresh state
        const fresh = await getDoc(doc(db, 'payments', paymentId));
        payment = fresh.data();
        const pdfBase64 = await buildPaymentPdfBase64(payment, paymentId);
        await sendPaymentNotifications(db, {
          payment, paymentId, status: newStatus,
          actorName, actorUid: me.uid,
          pdfBase64, pdfFilename: `Payment-Request-${paymentId}.pdf`
        });
        showToast(newStatus === 'approved' ? 'Approved.' : 'Declined.');
        render();
      } catch (err) {
        console.error(err);
        showToast('Could not save: ' + (err.message || ''), true);
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      me = user;
      try {
        const snap = await getDoc(doc(db, 'agents', user.uid));
        if (snap.exists()) { myProfile = snap.data(); myRole = myProfile.role || null; }
      } catch (_) {}
      const params = new URLSearchParams(location.search);
      paymentId = params.get('id');
      if (!paymentId) {
        document.getElementById('paneContent').innerHTML = `<div style="text-align:center;color:var(--muted);padding:30px 0;">Missing payment id.</div>`;
        return;
      }
      try {
        const snap = await getDoc(doc(db, 'payments', paymentId));
        if (!snap.exists()) {
          document.getElementById('paneContent').innerHTML = `<div style="text-align:center;color:var(--muted);padding:30px 0;">Payment request not found.</div>`;
          return;
        }
        payment = snap.data();
        render();
      } catch (err) {
        console.error(err);
        document.getElementById('paneContent').innerHTML = `<div style="text-align:center;color:var(--red);padding:30px 0;">Error: ${err.message || ''}</div>`;
      }
    });
  </script>
</body>
</html>

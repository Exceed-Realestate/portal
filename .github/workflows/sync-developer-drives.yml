name: Sync developer Drive folders → Firestore

# Runs every day at 02:00 UTC = 06:00 Dubai. Adjust cron as needed.
# Also can be triggered manually from Actions tab.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        # repo gitignores package-lock.json so we use `install` (not `ci`)
        run: npm install --no-audit --no-fund

      - name: Run sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/sync-developer-folder.js

name: Sync developer Drive folders → Firestore

# Runs every 15 minutes. The sync is idempotent (already-imported files
# skip via driveFileId before any download), so empty runs are fast (~30s).
# Also triggerable manually from the Actions tab.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        # repo gitignores package-lock.json so we use `install` (not `ci`)
        run: npm install --no-audit --no-fund

      - name: Run sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/sync-developer-folder.js

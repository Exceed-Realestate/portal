<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Booking Approval — Exceed Real Estate</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <!-- PWA: manifest, theme color, iOS install support. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#15171c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exceed">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script src="pwa-init.js" defer></script>
  <script src="theme-init.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="liquid.css">
  <style>
    :root {
      --navy-0: #15171c; --navy-1: #1c1f26; --navy-2: #262a33; --navy-3: #2f3340;
      --line: rgba(255,255,255,0.06); --line-strong: rgba(255,255,255,0.12);
      --text: #f5f7fa; --muted: #8a91a3; --gold: #ffd84d; --cream: #f5f7fa;
      --green:#5cc98f; --wa:#25d366; --radius:14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--navy-0); }
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background:
        var(--navy-0);
      color: var(--text); min-height: 100vh;
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px; border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px); background: rgba(5,20,40,0.7);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; color: inherit; }
    .brand img { width: 40px; height: 40px; border-radius: 8px; }
    .brand-name { font-family: 'Inter', 'Noto Sans JP', sans-serif; letter-spacing: 2px; font-weight: 600; }
    .brand-name span { color: var(--gold); font-weight: 400; }
    .topbar-right { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
    .topbar-right strong { color: var(--cream); font-weight: 600; }
    .icon-btn {
      background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      color: var(--text); padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-family: inherit; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
      transition: background .2s; display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--line-strong); }
    .icon-btn svg { width: 14px; height: 14px; }

    .page-head { max-width: 760px; margin: 0 auto; padding: 36px 32px 0; }
    .page-head .eyebrow { color: var(--gold); letter-spacing: 5px; font-size: 11px; text-transform: uppercase; margin-bottom: 10px; }
    .page-head h1 { font-family: 'Playfair Display', 'Noto Serif JP', serif; font-weight: 600; font-size: clamp(28px, 4vw, 40px); margin: 0 0 8px; }
    .page-head .lede { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.6; }

    main { max-width: 760px; margin: 0 auto; padding: 28px 32px 80px; }

    .booking-card {
      background: linear-gradient(180deg, rgba(16,42,79,0.85), rgba(10,31,61,0.85));
      backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 0 0 28px; position: relative;
      overflow: hidden;
    }

    /* Car hero image at top of the booking card */
    .car-hero {
      position: relative; height: 200px;
      background: radial-gradient(80% 100% at 50% 50%, rgba(212,184,122,0.18), rgba(10,31,61,0.6) 70%);
      display: grid; place-items: center;
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }
    .car-hero img {
      max-height: 75%; max-width: 80%; object-fit: contain;
      filter: drop-shadow(0 16px 24px rgba(0,0,0,0.45));
    }
    .car-hero::after {
      content: ''; position: absolute; inset: auto 0 0 0; height: 60%;
      background: linear-gradient(180deg, transparent, rgba(10,31,61,0.6));
      pointer-events: none;
    }
    .car-badge-overlay {
      position: absolute; top: 14px; left: 14px;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px;
      background: rgba(5,15,30,0.75); color: var(--gold);
      border: 1px solid rgba(212,184,122,0.4);
      font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    .booking-body { padding: 22px 28px 0; }

    /* Requester strip — avatar + name + role */
    .requester-strip {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: rgba(5,15,30,0.5);
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .requester-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(212,184,122,0.5);
      box-shadow: 0 6px 16px -6px rgba(0,0,0,0.5);
      flex-shrink: 0;
      background: linear-gradient(135deg, #f6ecc8, #d4b87a);
      display: grid; place-items: center;
      color: var(--navy-0);
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      font-size: 22px; font-weight: 700;
    }
    .requester-meta { min-width: 0; }
    .requester-eyebrow { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
    .requester-name { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: 17px; font-weight: 600; color: var(--cream); line-height: 1.2; }
    .requester-email { font-size: 12px; color: var(--muted); margin-top: 2px; word-break: break-all; }

    .booking-card h2 {
      font-family: 'Inter', 'Noto Sans JP', sans-serif; font-weight: 600;
      font-size: 26px; margin: 0 0 6px; color: var(--cream);
    }
    .booking-when { color: var(--gold); font-size: 16px; font-weight: 600; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
    .urgent-banner {
      background: rgba(255,107,107,0.12); border: 1px solid rgba(255,107,107,0.4);
      color: #ff8a78; padding: 10px 14px; border-radius: 10px;
      font-size: 12.5px; line-height: 1.5; margin-bottom: 18px;
    }
    .urgent-banner strong { color: #ffb3a8; }

    .field-grid { display: grid; gap: 12px; margin-bottom: 22px; }
    .field-row { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
    .field-row:last-child { border-bottom: none; }
    .field-key { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .field-val { font-size: 14px; color: var(--cream); line-height: 1.5; word-break: break-word; }
    .field-val.muted { color: var(--muted); }

    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    }
    .status-pill.pending  { background: rgba(255,209,102,0.14); color: #ffd166; border: 1px solid rgba(255,209,102,0.4); }
    .status-pill.approved { background: rgba(92,201,143,0.14); color: var(--green); border: 1px solid rgba(92,201,143,0.4); }
    .status-pill.declined { background: rgba(255,107,107,0.14); color: #ff8a78; border: 1px solid rgba(255,107,107,0.4); }
    .status-pill.cancelled { background: rgba(154,168,194,0.16); color: #c1c9da; border: 1px solid rgba(154,168,194,0.4); }
    .status-pill.withdrawn { background: rgba(154,168,194,0.16); color: #c1c9da; border: 1px solid rgba(154,168,194,0.4); }

    .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
    .btn {
      flex: 1; min-width: 160px;
      padding: 14px 22px; border-radius: 10px; border: none;
      font-family: inherit; font-size: 13px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: transform .15s, box-shadow .2s;
    }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .btn-approve {
      background: rgba(92,201,143,0.14);
      color: #87b39d;
      border: 1px solid rgba(92,201,143,0.4);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .btn-approve:hover { background: rgba(92,201,143,0.22); border-color: rgba(92,201,143,0.6); transform: translateY(-1px); box-shadow: 0 8px 18px -8px rgba(92,201,143,0.4); }
    .btn-decline {
      background: rgba(255,107,107,0.14); color: #ff8a78; border: 1px solid rgba(255,107,107,0.4);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .btn-decline:hover { background: rgba(255,107,107,0.22); border-color: rgba(255,107,107,0.6); transform: translateY(-1px); box-shadow: 0 8px 18px -8px rgba(255,107,107,0.4); }

    .decision-info {
      margin-top: 24px; padding: 18px;
      background: rgba(5,15,30,0.6); border: 1px solid var(--line); border-radius: 10px;
      font-size: 13px; color: var(--muted); line-height: 1.6;
    }
    .decision-info strong { color: var(--cream); }

    .denied {
      max-width: 520px; margin: 60px auto; text-align: center;
      padding: 36px 28px;
      background: rgba(16,42,79,0.6); border: 1px solid var(--line); border-radius: var(--radius);
    }
    .denied .icon { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%; background: rgba(255,107,107,0.14); border: 1px solid rgba(255,107,107,0.4); display: grid; place-items: center; color: #ff8a78; }
    .denied h2 { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-size: 22px; margin: 0 0 10px; color: var(--cream); }
    .denied p { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin: 0 0 20px; }

    .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 13px; }
    .loading::after { content: '…'; animation: dots 1.4s infinite; }
    @keyframes dots { 0%,20% { content: '.'; } 40% { content: '..'; } 60%,100% { content: '...'; } }

    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(5,15,30,0.95); border: 1px solid rgba(212,184,122,0.4);
      padding: 14px 22px; border-radius: 10px; color: var(--cream);
      font-size: 13.5px; transition: transform .35s cubic-bezier(.34,1.56,.64,1);
      z-index: 100; box-shadow: 0 20px 50px -10px rgba(0,0,0,0.7); max-width: 90%;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(255,107,107,0.5); color: #ff8a78; }

    .lang-toggle { display: inline-flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 999px; padding: 4px; position: relative; }
    .lang-toggle button { background: transparent; border: none; color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 1px; padding: 6px 12px; border-radius: 999px; cursor: pointer; transition: color .25s; position: relative; z-index: 1; }
    .lang-toggle button.active { color: var(--navy-0); }
    .lang-toggle .pill { position: absolute; top: 4px; bottom: 4px; background: var(--cream); border-radius: 999px; transition: transform .35s cubic-bezier(.34,1.56,.64,1), width .35s ease; z-index: 0; }

    @media (max-width: 600px) {
      .page-head, main { padding-left: 18px; padding-right: 18px; }
      .field-row { grid-template-columns: 1fr; gap: 2px; padding: 10px 0; }
      .field-key { font-size: 9px; }
      .booking-card { padding: 22px; }
      .actions .btn { flex: 1 1 100%; }
    }
    /* ============================================================
       v2 — Wise-style sidebar shell (matches agent.html)
       ============================================================ */
    .v2-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .v2-side {
      position: sticky; top: 0;
      height: 100vh; width: 240px;
      background: var(--navy-1);
      border-right: 1px solid var(--navy-3);
      display: flex; flex-direction: column;
      padding: 20px 14px 14px;
      z-index: 30;
    }
    .v2-brand {
      display: flex; align-items: center; gap: 10px;
      cursor: pointer; padding: 4px 6px 18px;
      border-bottom: 1px solid var(--navy-3);
    }
    .v2-brand-mark {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--gold); color: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 13px; letter-spacing: .5px;
      font-family: 'Inter', sans-serif;
    }
    .v2-brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
    .v2-brand-text strong { color: var(--cream); font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; }
    .v2-brand-text span { color: var(--muted); font-size: 10.5px; letter-spacing: .5px; }
    .v2-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; flex: 1; }
    .v2-nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; border-radius: 8px;
      color: var(--muted);
      font-size: 13.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      transition: background .15s, color .15s;
      position: relative;
    }
    .v2-nav-item:hover { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item svg { width: 18px; height: 18px; flex: none; }
    .v2-nav-item.active { background: var(--navy-2); color: var(--cream); }
    .v2-nav-item.active::before {
      content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px;
      width: 3px; background: var(--gold); border-radius: 0 3px 3px 0;
    }
    .v2-foot { display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid var(--navy-3); }
    .v2-foot-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 12px; border-radius: 8px;
      background: transparent; border: 0;
      color: var(--muted); font-size: 12.5px; font-weight: 500;
      font-family: 'Inter', sans-serif;
      text-align: left; cursor: pointer;
      transition: background .15s, color .15s;
      text-decoration: none;
    }
    .v2-foot-btn:hover { background: var(--navy-2); color: var(--cream); }
    .v2-foot-btn svg { width: 16px; height: 16px; flex: none; }
    .v2-main { display: flex; flex-direction: column; min-width: 0; padding: 0 0 40px; }
    .v2-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 18px 32px;
      border-bottom: 1px solid var(--navy-3);
      background: var(--navy-0);
    }
    .v2-top-user { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .v2-top-user strong { color: var(--cream); font-weight: 600; }
    .v2-top-actions { display: flex; align-items: center; gap: 10px; }
    .v2-main .page-head { padding-top: 32px; }
    .v2-main .page-head .eyebrow { color: var(--muted); letter-spacing: 1.8px; }
    @media (max-width: 1180px) {
      .v2-shell { grid-template-columns: 64px 1fr; }
      .v2-side { width: 64px; padding: 16px 8px; }
      .v2-brand-text, .v2-nav-item span, .v2-foot-btn span { display: none; }
      .v2-nav-item, .v2-foot-btn { justify-content: center; padding: 10px; }
      .v2-brand { justify-content: center; }
    }
    @media (max-width: 820px) {
      .v2-shell { grid-template-columns: 1fr; }
      .v2-side {
        position: relative; height: auto; width: 100%;
        flex-direction: row; align-items: center;
        padding: 12px 16px; border-right: 0;
        border-bottom: 1px solid var(--navy-3);
      }
      .v2-nav { flex-direction: row; margin-top: 0; gap: 4px; overflow-x: auto; }
      .v2-nav-item.active::before { display: none; }
      .v2-nav-item.active { box-shadow: inset 0 -2px 0 var(--gold); }
      .v2-foot { flex-direction: row; padding-top: 0; border-top: 0; }
      .v2-top { padding: 14px 18px; }
    }

  </style>
</head>
<body>
  <div class="v2-shell">

    <!-- ===== Sidebar ===== -->
    <aside class="v2-side">
      <div class="v2-brand" onclick="window.location.href='agent.html'" title="Exceed Real Estate">
        <div class="v2-brand-mark">EX</div>
        <div class="v2-brand-text">
          <strong>Exceed</strong>
          <span>REAL ESTATE</span>
        </div>
      </div>
      <nav class="v2-nav">
        <a class="v2-nav-item" href="agent.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>ダッシュボード</span>
        </a>
        <a class="v2-nav-item" href="availability.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>カレンダー</span>
        </a>
        <a class="v2-nav-item" href="team.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>チーム</span>
        </a>
        <a class="v2-nav-item" href="travel.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
          <span>出張</span>
        </a>
        <a class="v2-nav-item" href="database.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          <span>データベース</span>
        </a>
      </nav>
      <div class="v2-foot">
        <a class="v2-foot-btn" href="agent.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          <span data-i18n="back">ダッシュボード</span>
        </a>
      </div>
    </aside>

    <!-- ===== Main pane ===== -->
    <div class="v2-main">

      <header class="v2-top">
        <div class="v2-top-user">
          <span data-i18n="hello">こんにちは、</span><strong id="userName">—</strong>
        </div>
        <div class="v2-top-actions">
          <div class="lang-toggle" id="langToggle">
            <span class="pill" id="langPill"></span>
            <button data-lang="ja" class="active">日本語</button>
            <button data-lang="en">EN</button>
          </div>
        </div>
      </header>
  <div class="page-head">
    <div class="eyebrow" data-i18n="eyebrow">Car Booking</div>
    <h1 data-i18n="title">承認リクエスト</h1>
    <p class="lede" data-i18n="lede">下記の予約内容を確認し、承認または却下してください。</p>
  </div>

  <main>
    <div id="content"><div class="loading" data-i18n="loading">読み込み中</div></div>
  </main>

  <div class="toast" id="toast"></div>
    </div><!-- /v2-main -->
  </div><!-- /v2-shell -->

  <script type="module">
    import { auth, db, isAdmin, can } from './firebase-init.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { doc, getDoc, updateDoc, addDoc, collection, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
    import { sendCarBookingNotifications } from './car-notify.js';

    function fmtRangeStatic(b, lang) {
      const start = new Date(b.startISO);
      const end = new Date(b.endISO);
      const datePart = new Intl.DateTimeFormat(lang === 'ja' ? 'ja-JP' : 'en-GB',
        { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' }).format(start);
      const timeFmt = new Intl.DateTimeFormat(lang === 'ja' ? 'ja-JP' : 'en-GB',
        { hour: '2-digit', minute: '2-digit' });
      return `${datePart} · ${timeFmt.format(start)} – ${timeFmt.format(end)}`;
    }

    const I18N = {
      ja: {

        title: '承認リクエスト',

        approving: '承認中…', declining: '却下中…',

      en: {

        loading: 'Loading',

        invalidLinkBody: 'No booking ID in the URL. Please use the link from WhatsApp.',

        notFoundBody: 'This booking was deleted or the link is incorrect.',

        loadFailedBody: 'Something went wrong fetching the booking. Please try again later.',

        deniedBody: 'Only the CEO (Teruo) and MD (Shoya) can approve car bookings.',
        car: 'Vehicle', when: 'When', requester: 'Requester', email: 'Email',
        property: 'Property', area: 'Area', leadSource: 'Lead source',
        client: 'Client', budget: 'Budget (AED)', notes: 'Notes',
        urgentBanner: '<strong>⚠ Urgent — outside the 3-day notice rule.</strong> Please consider as an exception.',
        statusPending: 'Pending', statusApproved: 'Approved', statusDeclined: 'Declined', statusCancelled: 'Cancelled', statusWithdrawn: 'Withdrawn',
        approve: 'Approve', decline: 'Decline',
        approving: 'Approving…', declining: 'Declining…',
        approvedToast: '✓ Approved',
        declinedToast: '✗ Declined',
        alreadyDecidedToast: 'This booking was already decided by another approver',
        actionFailed: 'Update failed: ',
        decisionByApprovedJa: 'Approved by <strong>{name}</strong> on <strong>{when}</strong>.',
        decisionByDeclinedJa: 'Declined by <strong>{name}</strong> on <strong>{when}</strong>.',
        loginRequired: 'Login required',
        loginBody: 'Sign in with your @exceed-re.ae account to approve this booking.',
        signInBtn: 'Sign in →'
      }
    };
    let currentLang = 'ja';
    function setLang(lang) {
      currentLang = lang;
      const dict = I18N[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (dict[k]) el.textContent = dict[k]; });
      document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      positionPill();
      // Re-render the body so all internal copy translates
      if (window._bookingState) renderBooking(window._bookingState);
    }
    function positionPill() {
      const pill = document.getElementById('langPill');
      const active = document.querySelector('.lang-toggle button.active');
      if (!active || !pill) return;
      const r = active.getBoundingClientRect();
      const pr = active.parentElement.getBoundingClientRect();
      pill.style.width = r.width + 'px';
      pill.style.transform = `translateX(${r.left - pr.left - 4}px)`;
    }
    document.querySelectorAll('.lang-toggle button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.toggle('error', !!isError);
      t.classList.add('show');
      clearTimeout(t._tm);
      t._tm = setTimeout(() => t.classList.remove('show'), 3200);
    }

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function fmtRange(b) {
      const start = new Date(b.startISO);
      const end = new Date(b.endISO);
      const datePart = new Intl.DateTimeFormat(currentLang === 'ja' ? 'ja-JP' : 'en-GB', { year: 'numeric', month: 'short', day: 'numeric', weekday: 'short' }).format(start);
      const timeFmt = new Intl.DateTimeFormat(currentLang === 'ja' ? 'ja-JP' : 'en-GB', { hour: '2-digit', minute: '2-digit' });
      return `${datePart} · ${timeFmt.format(start)} – ${timeFmt.format(end)}`;
    }
    function fmtWhen(ts) {
      if (!ts) return '—';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return new Intl.DateTimeFormat(currentLang === 'ja' ? 'ja-JP' : 'en-GB', { dateStyle: 'medium', timeStyle: 'short' }).format(d);
    }

    /* ----- Permission gate -----
       Car bookings only need CEO or MD approval (Shoya = MD, Teruo = CEO).
       isAdmin keeps the system owner unblocked even before their role doc
       is set. CAR_APPROVER_EMAILS is the explicit fallback for named
       approvers whose Firestore role hasn't been assigned yet. */
    const CAR_APPROVER_ROLES = ['ceo', 'md'];
    const CAR_APPROVER_EMAILS = new Set([
      'shoya@exceed-re.ae',
      'teruo@exceed-re.ae'
    ]);
    function canApprove(role, email) {
      if (isAdmin(email)) return true;
      if (email && CAR_APPROVER_EMAILS.has(email.toLowerCase())) return true;
      return !!(role && CAR_APPROVER_ROLES.includes(role));
    }

    function renderInvalid(titleKey, bodyKey) {
      const dict = I18N[currentLang];
      document.getElementById('content').innerHTML = `
        <div class="denied">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
          <h2>${dict[titleKey]}</h2>
          <p>${dict[bodyKey]}</p>
          <a class="icon-btn" href="agent.html"><span>${dict.back}</span></a>
        </div>`;
    }

    function renderLoginRequired() {
      const dict = I18N[currentLang];
      const here = encodeURIComponent(location.pathname + location.search);
      document.getElementById('content').innerHTML = `
        <div class="denied">
          <div class="icon" style="background:rgba(212,184,122,0.14); border-color:rgba(212,184,122,0.4); color:var(--gold)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
          <h2>${dict.loginRequired}</h2>
          <p>${dict.loginBody}</p>
          <a class="icon-btn" href="index.html?return=${here}" style="background:rgba(212,184,122,0.14);border-color:rgba(212,184,122,0.4);color:var(--gold)">${dict.signInBtn}</a>
        </div>`;
    }

    function renderDenied() {
      const dict = I18N[currentLang];
      document.getElementById('content').innerHTML = `
        <div class="denied">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="26" height="26"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
          <h2>${dict.deniedTitle}</h2>
          <p>${dict.deniedBody}</p>
          <a class="icon-btn" href="agent.html">${dict.back}</a>
        </div>`;
    }

    function renderBooking(state) {
      const dict = I18N[currentLang];
      const b = state.booking;
      const carName = b.car === 'phantom' ? 'Rolls-Royce Phantom' : 'Cadillac Escalade';
      const statusKey = b.status === 'approved'  ? 'statusApproved'
                       : b.status === 'declined'  ? 'statusDeclined'
                       : b.status === 'cancelled' ? 'statusCancelled'
                       : b.status === 'withdrawn' ? 'statusWithdrawn'
                       : 'statusPending';

      // Decision info card if already actioned
      let decisionHtml = '';
      if (b.status === 'approved' || b.status === 'declined') {
        const tmplKey = b.status === 'approved' ? 'decisionByApprovedJa' : 'decisionByDeclinedJa';
        const html = (dict[tmplKey] || '')
          .replace('{name}', escHtml(b.decidedByName || b.decidedByEmail || '—'))
          .replace('{when}', escHtml(fmtWhen(b.decidedAt)));
        decisionHtml = `<div class="decision-info">${html}</div>`;
      }

      // Action buttons (only if pending and user can approve)
      let actionsHtml = '';
      if (b.status === 'pending' && state.canApprove) {
        actionsHtml = `
          <div class="actions">
            <button class="btn btn-approve" onclick="actOnBooking('approved')" id="approveBtn">${dict.approve}</button>
            <button class="btn btn-decline" onclick="actOnBooking('declined')" id="declineBtn">${dict.decline}</button>
          </div>`;
      } else if (b.status === 'pending' && !state.canApprove) {
        actionsHtml = `<div class="decision-info">${dict.deniedBody}</div>`;
      }

      const urgent = b.urgent ? `<div class="urgent-banner">${dict.urgentBanner}</div>` : '';

      // Field grid — drop car/when (now in hero) and requester/email (now in strip)
      const fields = [
        ['property',    b.property || '—'],
        ['area',        b.area || '—'],
        ['leadSource',  b.leadSource || '—'],
        ['client',      b.client || '—'],
        ['budget',      b.budget ? Number(b.budget).toLocaleString() : '—'],
        ['notes',       b.notes || '—']
      ];
      const rowsHtml = fields.map(([k, v]) =>
        `<div class="field-row"><div class="field-key">${dict[k] || k}</div><div class="field-val${v === '—' ? ' muted' : ''}">${escHtml(v)}</div></div>`
      ).join('');

      // Car hero — primary PNG; if missing, fall back to JPG; if that also
      // fails, hide the broken-image icon entirely.
      const carImgPrimary = `cars/${b.car}.png`;
      const carImgFallback = `cars/${b.car}.jpg`;
      const carImgHtml = `<img src="${carImgPrimary}" alt="${escHtml(carName)}" onerror="if(!this._fb){this._fb=1;this.src='${carImgFallback}';}else{this.onerror=null;this.style.display='none';}">`;

      // Requester strip — use linked agent's photo if available, else initial
      const agent = state.requesterAgent || {};
      const photoURL = agent.photoURL || '';
      const initial = ((b.requesterName || agent.firstName || b.requesterEmail || '?').trim()[0] || '?').toUpperCase();
      const avatarHtml = photoURL
        ? `<img class="requester-avatar" src="${escHtml(photoURL)}" alt="${escHtml(b.requesterName || '')}" onerror="this.outerHTML='<div class=\\'requester-avatar\\'>${initial}</div>'">`
        : `<div class="requester-avatar">${initial}</div>`;

      document.getElementById('content').innerHTML = `
        <div class="booking-card">
          <div class="car-hero">
            <span class="car-badge-overlay">${carName}</span>
            ${carImgHtml}
          </div>
          <div class="booking-body">
            <div class="requester-strip">
              ${avatarHtml}
              <div class="requester-meta">
                <div class="requester-eyebrow">${dict.requester}</div>
                <div class="requester-name">${escHtml(b.requesterName || '—')}</div>
                <div class="requester-email">${escHtml(b.requesterEmail || '')}</div>
              </div>
            </div>
            <h2>${dict.title}</h2>
            <div class="booking-when">${fmtRange(b)}</div>
            <div style="margin-bottom:18px"><span class="status-pill ${b.status}">${dict[statusKey]}</span></div>
            ${urgent}
            <div class="field-grid">${rowsHtml}</div>
            ${actionsHtml}
            ${decisionHtml}
          </div>
        </div>`;
    }

    window.actOnBooking = async function(newStatus) {
      const state = window._bookingState;
      if (!state) return;
      const dict = I18N[currentLang];
      const aBtn = document.getElementById('approveBtn');
      const dBtn = document.getElementById('declineBtn');
      [aBtn, dBtn].forEach(b => { if (b) b.disabled = true; });
      if (aBtn) aBtn.textContent = newStatus === 'approved' ? dict.approving : dict.approve;
      if (dBtn) dBtn.textContent = newStatus === 'declined' ? dict.declining : dict.decline;
      try {
        const u = state.user;
        const decidedByName = u.displayName || (u.email ? u.email.split('@')[0] : '—');
        const ref = doc(db, 'carBookings', state.id);

        // Transaction guards against the two-approvers-tap-at-once race:
        // re-read the doc under the txn; bail if someone already decided.
        await runTransaction(db, async (tx) => {
          const fresh = await tx.get(ref);
          if (!fresh.exists()) throw new Error('not-found');
          if (fresh.data().status !== 'pending') {
            const e = new Error('already-decided');
            e.code = 'already-decided';
            throw e;
          }
          tx.update(ref, {
            status: newStatus,
            decidedAt: serverTimestamp(),
            decidedByUid: u.uid,
            decidedByEmail: u.email,
            decidedByName
          });
        });
        showToast(newStatus === 'approved' ? dict.approvedToast : dict.declinedToast);

        // Fire-and-forget: notification + email writes. Don't block the UI on these.
        sendCarBookingNotifications(db, {
          booking: state.booking, bookingId: state.id, status: newStatus, actorName: decidedByName
        }).catch(err => console.warn('decision notifications failed', err));

        // Reload the doc to show the decision info — keep the cached requesterAgent
        const snap = await getDoc(ref);
        state.booking = { ...snap.data() };
        renderBooking(state);  // requesterAgent is already on state from loadBooking
      } catch (err) {
        console.error(err);
        if (err.code === 'already-decided') {
          showToast(dict.alreadyDecidedToast, true);
          // Re-fetch to show the actual current state to the second clicker.
          try {
            const snap = await getDoc(doc(db, 'carBookings', state.id));
            if (snap.exists()) {
              state.booking = { ...snap.data() };
              renderBooking(state);
            }
          } catch (_) { /* leave the existing render */ }
        } else {
          showToast(dict.actionFailed + (err.message || err.code || 'unknown'), true);
          [aBtn, dBtn].forEach(b => { if (b) b.disabled = false; });
          if (aBtn) aBtn.textContent = dict.approve;
          if (dBtn) dBtn.textContent = dict.decline;
        }
      }
    };

    async function loadBooking(user) {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const action = params.get('action'); // approve | decline (auto-action from WhatsApp link)
      if (!id) { renderInvalid('invalidLink', 'invalidLinkBody'); return; }

      try {
        const snap = await getDoc(doc(db, 'carBookings', id));
        if (!snap.exists()) { renderInvalid('notFound', 'notFoundBody'); return; }
        const booking = { ...snap.data() };

        // Resolve user role via agent doc to gate the action buttons,
        // and pull the requester's agent doc to surface their photo.
        let role = null;
        let requesterAgent = null;
        try {
          const [meSnap, reqSnap] = await Promise.all([
            getDoc(doc(db, 'agents', user.uid)),
            booking.requesterUid ? getDoc(doc(db, 'agents', booking.requesterUid)) : Promise.resolve(null)
          ]);
          if (meSnap.exists()) role = meSnap.data().role || null;
          if (reqSnap && reqSnap.exists()) requesterAgent = reqSnap.data();
        } catch (_) {}

        const state = { id, booking, user, role, requesterAgent, canApprove: canApprove(role, user.email) };
        window._bookingState = state;
        renderBooking(state);

        // If the WhatsApp link included ?action=approve|decline AND the user
        // has permission AND the booking is still pending, auto-execute.
        if (booking.status === 'pending' && state.canApprove && (action === 'approve' || action === 'decline')) {
          // Tiny delay so the user sees the booking briefly before the toast lands
          setTimeout(() => actOnBooking(action === 'approve' ? 'approved' : 'declined'), 300);
        }
      } catch (err) {
        console.error(err);
        renderInvalid('loadFailed', 'loadFailedBody');
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { renderLoginRequired(); return; }
      let firstName = (user.displayName || '').trim().split(/\s+/)[0];
      try {
        const snap = await getDoc(doc(db, 'agents', user.uid));
        if (snap.exists() && snap.data().firstName) firstName = snap.data().firstName;
      } catch (_) {}
      if (!firstName && user.email) {
        const local = user.email.split('@')[0].split(/[._-]/)[0];
        firstName = local.charAt(0).toUpperCase() + local.slice(1);
      }
      document.getElementById('userName').textContent = firstName || 'Agent';
      loadBooking(user);
    });

    window.addEventListener('load', () => { setLang('ja'); });
    window.addEventListener('resize', positionPill);
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'e') {
        e.preventDefault();
        setLang(currentLang === 'ja' ? 'en' : 'ja');
      }
    });
  </script>
